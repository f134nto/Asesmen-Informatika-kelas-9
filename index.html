    function createInitialSubmissions(students, questions) {
      const subs = [];
      students.forEach((st, i) => {
        if (st.id === 'S03' || st.id === 'S06') return;
        const ability = 0.62 + ((i * 19 + 7) % 34) / 100;
        const answers = {};
        const essayScores = {};
        let pgScore = 0, pgkScore = 0, essayTotal = 0;

        questions.forEach((q, qIdx) => {
          const diffPenalty = q.level === 'C4' ? 0.25 : q.level === 'C3' ? 0.14 : q.level === 'C2' ? 0.06 : 0.0;
          const seedVal = ((i * 37 + qIdx * 17 + 13) % 100) / 100;
          const isCorrect = seedVal < Math.max(0.25, ability - diffPenalty);

          if (q.type === 'PG') {
            if (isCorrect) {
              answers[q.no] = q.answer;
              pgScore += 2;
            } else {
              answers[q.no] = (q.answer + 1 + (i % 3)) % 4;
            }
          } else if (q.type === 'PGK') {
            if (isCorrect) {
              answers[q.no] = [...q.answers];
              pgkScore += 2;
            } else if (seedVal < ability + 0.1) {
              answers[q.no] = [q.answers[0], 2];
              pgkScore += 1;
            } else {
              answers[q.no] = [2, 3];
            }
          } else if (q.type === 'ESSAY') {
            const sc = isCorrect ? 4 : (seedVal < ability + 0.12 ? 3 : 2);
            answers[q.no] = sc === 4 ? q.sampleAnswer : 'Jawaban konsep ' + q.materi + ' sesuai buku informatika.';
            essayScores[q.no] = sc;
            essayTotal += sc;
          }
        });

        subs.push({
          id: 'SUB-' + st.id,
          studentId: st.id,
          studentName: st.name,
          kelas: st.kelas,
          submittedAt: `24 Nov 2026, 08:${String(10 + (i * 2) % 50).padStart(2, '0')} WIB`,
          durationUsed: `${40 + (i * 5) % 38} menit`,
          answers,
          essayScores,
          pgScore,
          pgkScore,
          essayScore: essayTotal,
          totalScore: pgScore + pgkScore + essayTotal,
          attemptCount: 1
        });
      });
      return subs;
    }

        }));
      } catch (err) {

    }

    /*************************************************************************
     * ENGINE HITUNG ULANG NILAI (RECALCULATE ALL SUBMISSIONS)
     * Otomatis dipanggil saat Kunci Jawaban diubah guru di Bank Soal / Analisis
     *************************************************************************/
    function calculateSubmissionScore(sub, questions) {
      let pg = 0, pgk = 0, essay = 0;
      const qMap = {};
      questions.forEach(q => qMap[q.no] = q);

      questions.forEach(q => {
        if (q.type === 'PG') {
          if (sub.answers && sub.answers[q.no] === q.answer) pg += 2;
        } else if (q.type === 'PGK') {
          const ans = (sub.answers && Array.isArray(sub.answers[q.no])) ? sub.answers[q.no] : [];
          const correctCount = ans.filter(a => q.answers.includes(a)).length;
          const wrongCount = ans.filter(a => !q.answers.includes(a)).length;
          if (correctCount === 2 && wrongCount === 0) pgk += 2;
          else if (correctCount === 1 && ans.length <= 2) pgk += 1;
        } else if (q.type === 'ESSAY') {
          if (sub.essayScores && typeof sub.essayScores[q.no] === 'number') {
            essay += sub.essayScores[q.no];
          } else {
            const txt = String(sub.answers?.[q.no] || '').trim();
            const sc = txt.length >= 45 ? 4 : txt.length >= 20 ? 3 : txt.length >= 5 ? 2 : 0;
            if (!sub.essayScores) sub.essayScores = {};
            sub.essayScores[q.no] = sc;
            essay += sc;
          }
        }
      });

      sub.pgScore = pg;
      sub.pgkScore = pgk;
      sub.essayScore = essay;
      sub.totalScore = pg + pgk + essay;
      return sub;
    }

    function recalculateAllSubmissions(silent = false) {
      appState.submissions.forEach(sub => calculateSubmissionScore(sub, appState.questions));
      saveState();
      cloudPost({ action: 'saveSubmissions', submissions: appState.submissions, questionsMeta: getQuestionsMeta() }, true);
      if (!silent) showToast('Seluruh nilai siswa berhasil dihitung ulang sesuai kunci jawaban terbaru!');
    }

    function exportDatabaseJSON() {
      const dump = {
        app: 'EduAssess Pro',
        version: '3.0',
        exportedAt: new Date().toISOString(),
        settings: appSettings,
        questions: appState.questions,
        students: appState.students,
        submissions: appState.submissions
      };
      const json = JSON.stringify(dump, null, 2);
      const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `EduAssess_Backup_Informatika_IX_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('File cadangan database berhasil diunduh!');
    }

    function importDatabaseJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (!Array.isArray(parsed.questions) || !Array.isArray(parsed.students)) {
            throw new Error('Format file cadangan tidak valid.');
          }
          appState.questions = parsed.questions;
          appState.students = parsed.students;
          appState.submissions = Array.isArray(parsed.submissions) ? parsed.submissions : [];
          if (parsed.settings) appSettings = { ...appSettings, ...parsed.settings };
          saveSettings();
          saveState();
          cloudPost({ action: 'saveAll', students: appState.students, submissions: appState.submissions, questions: appState.questions }, true);
          closeModal();
          switchTab(appState.activeTab);
          showToast('Database berhasil dipulihkan dari file cadangan!');
        } catch (err) {
          showToast('Gagal memulihkan: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    const APPS_SCRIPT_CODE = `// =========================================================================
// KODE GOOGLE APPS SCRIPT — ASESMEN INFORMATIKA KELAS IX (9A–9K)
// Otomatis membentuk & menyinkronkan:
// 1. Rekap_Per_Kelas (Ringkasan semua kelas 9A–9K)

var LIST_CLASSES = ['9A', '9B', '9C', '9D', '9E', '9F', '9G', '9H', '9I', '9J', '9K'];
var KKTP_SCORE = 75;
var SPREADSHEET_ID = '';

function getTargetSpreadsheet() {
  if (SPREADSHEET_ID && SPREADSHEET_ID.trim() !== '') {
    return SpreadsheetApp.openById(SPREADSHEET_ID.trim());
  }
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (ss) return ss;
  var props = PropertiesService.getScriptProperties();
  var savedId = props.getProperty('AUTO_SPREADSHEET_ID');
  if (savedId) {
    try { return SpreadsheetApp.openById(savedId); } catch (e) {}
  }
  ss = SpreadsheetApp.create('Database Asesmen Informatika Kelas IX (9A-9K)');
  props.setProperty('AUTO_SPREADSHEET_ID', ss.getId());
  return ss;
}

function getOrCreateSheet(ss, name, headers) {
  var sheet = ss.getSheetByName(name);
  if (!sheet) {
    sheet = ss.insertSheet(name);
    if (headers && headers.length) {
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold');
      sheet.setFrozenRows(1);
    }
  }
  return sheet;
}

function jsonResponse(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function getPredikatText(score) {
  if (score >= 90) return 'A (Sangat Baik)';
  if (score >= 80) return 'B (Baik)';
  if (score >= KKTP_SCORE) return 'C (Cukup)';
  return 'D (Remedial)';
}

function readAllFromSheets(ss) {
  var shSiswa = getOrCreateSheet(ss, 'Data_Siswa', ['ID', 'NIS', 'Nama', 'Kelas', 'JK']);
  var shNilai = getOrCreateSheet(ss, 'Nilai_Ujian', [
    'ID', 'StudentID', 'Nama', 'Kelas', 'Waktu', 'Durasi',
    'Skor_PG', 'Skor_PGK', 'Skor_Esai', 'Nilai_Akhir', 'Status',
    'Jawaban_JSON', 'Skor_Esai_JSON', 'Percobaan'
  ]);
  var shSoal = getOrCreateSheet(ss, 'Bank_Soal', ['No', 'Data_JSON']);

  var students = [];
  var siswaRows = shSiswa.getDataRange().getValues();
  for (var i = 1; i < siswaRows.length; i++) {
    if (!siswaRows[i][0] && !siswaRows[i][2]) continue;
    students.push({
      id: String(siswaRows[i][0]),
      nis: String(siswaRows[i][1]),
      name: String(siswaRows[i][2]),
      kelas: String(siswaRows[i][3]),
      gender: String(siswaRows[i][4] || 'L')
    });
  }

  var submissions = [];
  var nilaiRows = shNilai.getDataRange().getValues();
  for (var j = 1; j < nilaiRows.length; j++) {
    if (!nilaiRows[j][0]) continue;
    var ansObj = {}, esObj = {};
    try { ansObj = JSON.parse(nilaiRows[j][11] || '{}'); } catch (err) {}
    try { esObj = JSON.parse(nilaiRows[j][12] || '{}'); } catch (err) {}
    submissions.push({
      id: String(nilaiRows[j][0]),
      studentId: String(nilaiRows[j][1]),
      studentName: String(nilaiRows[j][2]),
      kelas: String(nilaiRows[j][3]),
      submittedAt: String(nilaiRows[j][4]),
      durationUsed: String(nilaiRows[j][5]),
      pgScore: Number(nilaiRows[j][6]) || 0,
      pgkScore: Number(nilaiRows[j][7]) || 0,
      essayScore: Number(nilaiRows[j][8]) || 0,
      totalScore: Number(nilaiRows[j][9]) || 0,
      answers: ansObj,
      essayScores: esObj,
      attemptCount: Number(nilaiRows[j][13]) || 1
    });
  }

  var questions = [];
  var soalRows = shSoal.getDataRange().getValues();
  for (var k = 1; k < soalRows.length; k++) {
    if (!soalRows[k][1]) continue;
    try { questions.push(JSON.parse(soalRows[k][1])); } catch (err) {}
  }

  return { students: students, submissions: submissions, questions: questions };
}

function writeClassNilaiSheet(ss, kelas, studentsMap, subs) {
  var sh = getOrCreateSheet(ss, 'Nilai_' + kelas, []);
  sh.clear();

  var title = [['DAFTAR NILAI ASESMEN INFORMATIKA — KELAS ' + kelas, '', '', '', '', '', '', '', '', '', '', '']];
  var headers = [['No', 'NIS', 'Nama Siswa', 'Kelas', 'Waktu Kumpul', 'Durasi', 'PG (60)', 'PGK (20)', 'Esai (20)', 'Nilai Akhir', 'Predikat', 'Status']];
  var rows = [];

  for (var i = 0; i < subs.length; i++) {
    var s = subs[i];
    var nis = studentsMap[s.studentId] ? studentsMap[s.studentId].nis : '-';
    rows.push([
      i + 1, nis, s.studentName, s.kelas, s.submittedAt, s.durationUsed,
      s.pgScore, s.pgkScore, s.essayScore, s.totalScore,
      getPredikatText(s.totalScore),
      s.totalScore >= KKTP_SCORE ? 'Tuntas' : 'Remedial'
    ]);
  }

  sh.getRange(1, 1, 1, 12).setValues(title).merge()
    .setBackground('#4338ca').setFontColor('#ffffff').setFontWeight('bold').setFontSize(12);
  sh.getRange(2, 1, 1, 12).setValues(headers)
    .setBackground('#e0e7ff').setFontColor('#1e1b4b').setFontWeight('bold');
  sh.setFrozenRows(2);

  if (rows.length > 0) {
    sh.getRange(3, 1, rows.length, 12).setValues(rows);
    var totalSum = 0, maxV = -1, minV = 101, tuntasCnt = 0;
    for (var r = 0; r < subs.length; r++) {
      var sc = Number(subs[r].totalScore) || 0;
      totalSum += sc;
      if (sc > maxV) maxV = sc;
      if (sc < minV) minV = sc;
      if (sc >= KKTP_SCORE) tuntasCnt++;
    }
    var avg = Number((totalSum / subs.length).toFixed(1));
    var pct = Math.round((tuntasCnt / subs.length) * 100);
    var footerRow = 3 + rows.length + 1;
    sh.getRange(footerRow, 1, 1, 12).setValues([[
      '', 'RINGKASAN', 'Peserta: ' + subs.length + ' siswa', 'Tertinggi: ' + maxV, 'Terendah: ' + minV, '',
      '', '', 'Rata-Rata:', avg, 'Ketuntasan:', pct + '% (' + tuntasCnt + '/' + subs.length + ')'
    ]]).setBackground('#f1f5f9').setFontWeight('bold');
  } else {
    sh.getRange(3, 1).setValue('Belum ada data nilai untuk kelas ' + kelas);
  }
}

function writeClassAnalisisSheet(ss, kelas, subs, questions) {
  var sh = getOrCreateSheet(ss, 'Analisis_' + kelas, []);
  sh.clear();

  sh.getRange(1, 1, 1, 7).setValues([['ANALISIS NILAI & BUTIR SOAL — KELAS ' + kelas, '', '', '', '', '', '']]).merge()
    .setBackground('#047857').setFontColor('#ffffff').setFontWeight('bold').setFontSize(12);

  var scores = subs.map(function(s) { return Number(s.totalScore) || 0; }).sort(function(a, b) { return a - b; });
  var n = scores.length;
  var maxS = n ? scores[n - 1] : 0;
  var minS = n ? scores[0] : 0;
  var sumS = 0, tuntas = 0;
  for (var i = 0; i < n; i++) {
    sumS += scores[i];
    if (scores[i] >= KKTP_SCORE) tuntas++;
  }
  var meanS = n ? Number((sumS / n).toFixed(1)) : 0;
  var medianS = n ? (n % 2 === 1 ? scores[Math.floor(n / 2)] : Number(((scores[n / 2 - 1] + scores[n / 2]) / 2).toFixed(1))) : 0;
  var pctTuntas = n ? Math.round((tuntas / n) * 100) : 0;

  var statRows = [
    ['Jumlah Peserta Dinilai', n + ' siswa', '', 'Nilai Tertinggi', maxS, 'Tuntas (>= ' + KKTP_SCORE + ')', tuntas + ' siswa (' + pctTuntas + '%)'],
    ['Rata-Rata (Mean)', meanS, '', 'Nilai Terendah', minS, 'Remedial (< ' + KKTP_SCORE + ')', (n - tuntas) + ' siswa'],
    ['Nilai Tengah (Median)', medianS, '', 'KKTP Madrasah', KKTP_SCORE, 'Status Kelas', pctTuntas >= 75 ? 'Tuntas Klasikal' : 'Perlu Penguatan']
  ];
  sh.getRange(2, 1, 3, 7).setValues(statRows).setBackground('#ecfdf5');
  sh.getRange(2, 1, 3, 1).setFontWeight('bold');
  sh.getRange(2, 4, 3, 1).setFontWeight('bold');
  sh.getRange(2, 6, 3, 1).setFontWeight('bold');

  sh.getRange(6, 1, 1, 7).setValues([['No', 'Materi', 'Bentuk', 'Level', 'Daya Serap (%)', 'Tingkat Kesukaran', 'Rekomendasi']])
    .setBackground('#d1fae5').setFontColor('#064e3b').setFontWeight('bold');
  sh.setFrozenRows(6);

  if (questions && questions.length > 0) {
    var itemRows = [];
    for (var qIdx = 0; qIdx < questions.length; qIdx++) {
      var q = questions[qIdx];
      var totalEarned = 0;
      var maxPerStudent = q.type === 'ESSAY' ? 4 : 2;
      for (var sIdx = 0; sIdx < subs.length; sIdx++) {
        var sub = subs[sIdx];
        if (q.type === 'PG') {
          if (sub.answers && sub.answers[q.no] === q.answer) totalEarned += 2;
        } else if (q.type === 'PGK') {
          var ans = (sub.answers && Array.isArray(sub.answers[q.no])) ? sub.answers[q.no] : [];
          var qAns = Array.isArray(q.answers) ? q.answers : [];
          var correctCnt = 0, wrongCnt = 0;
          for (var a = 0; a < ans.length; a++) {
            if (qAns.indexOf(ans[a]) !== -1) correctCnt++;
            else wrongCnt++;
          }
          if (correctCnt === 2 && wrongCnt === 0) totalEarned += 2;
          else if (correctCnt === 1 && ans.length <= 2) totalEarned += 1;
        } else {
          totalEarned += (sub.essayScores && sub.essayScores[q.no]) ? Number(sub.essayScores[q.no]) : 0;
        }
      }
      var pct = n ? Math.round((totalEarned / (n * maxPerStudent)) * 100) : 0;
      var diff = 'Sedang', rec = 'Dipertahankan';
      if (n === 0) { diff = '-'; rec = 'Belum ada data'; }
      else if (pct >= 75) { diff = 'Mudah'; rec = 'Baik / Pengayaan'; }
      else if (pct < 45) { diff = 'Sukar'; rec = 'Perlu Remedial / Evaluasi'; }
      itemRows.push([q.no, q.materi || '-', q.type, q.level || '-', pct + '%', diff, rec]);
    }
    sh.getRange(7, 1, itemRows.length, 7).setValues(itemRows);
  } else {
    sh.getRange(7, 1).setValue('Sinkronkan Bank Soal dari Panel Guru agar analisis 45 butir soal muncul lengkap.');
  }
}

function rebuildClassReports(ss, targetClasses, students, submissions, questions) {
  var studentsMap = {};
  for (var i = 0; i < students.length; i++) studentsMap[students[i].id] = students[i];

  var shRekap = getOrCreateSheet(ss, 'Rekap_Per_Kelas', []);

    .setBackground('#1e293b').setFontColor('#ffffff').setFontWeight('bold').setFontSize(12);
  shRekap.getRange(2, 1, 1, 9).setValues([['Kelas', 'Total Siswa', 'Sudah Ujian', 'Tertinggi', 'Terendah', 'Rata-Rata', 'Tuntas', 'Remedial', '% Ketuntasan']])
    .setBackground('#e2e8f0').setFontWeight('bold');
  shRekap.setFrozenRows(2);

  var rekapRows = [];
  for (var c = 0; c < LIST_CLASSES.length; c++) {

    for (var j = 0; j < n; j++) {
      var sc = Number(clsSubs[j].totalScore) || 0;
      sum += sc;
      if (sc > maxS) maxS = sc;
      if (sc < minS) minS = sc;
      if (sc >= KKTP_SCORE) tuntas++;
    }
    var avg = n ? Number((sum / n).toFixed(1)) : 0;

      writeClassAnalisisSheet(ss, cls, clsSubs, questions);
    }
  }
  shRekap.getRange(3, 1, rekapRows.length, 9).setValues(rekapRows);
}

function doGet(e) {
  try {
    var ss = getTargetSpreadsheet();
    var action = (e && e.parameter && e.parameter.action) ? e.parameter.action : 'loadAll';

    if (action === 'ping') {
      return jsonResponse({
        ok: true,
        spreadsheetName: ss.getName(),
        spreadsheetUrl: ss.getUrl(),
        message: 'Terhubung ke Spreadsheet: ' + ss.getName()
      });
    }

    var all = readAllFromSheets(ss);
    return jsonResponse({
      ok: true,
      spreadsheetName: ss.getName(),
      spreadsheetUrl: ss.getUrl(),
      students: all.students,
      submissions: all.submissions,
      questions: all.questions
    });
  } catch (err) {
    return jsonResponse({ ok: false, error: err.message });
  }
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    lock.waitLock(20000);
    var ss = getTargetSpreadsheet();
    var rawBody = (e && e.postData && e.postData.contents) ? e.postData.contents : '{}';
    var payload = JSON.parse(rawBody);
    var action = payload.action;

    var shSiswa = getOrCreateSheet(ss, 'Data_Siswa', ['ID', 'NIS', 'Nama', 'Kelas', 'JK']);
    var shNilai = getOrCreateSheet(ss, 'Nilai_Ujian', [
      'ID', 'StudentID', 'Nama', 'Kelas', 'Waktu', 'Durasi',
      'Skor_PG', 'Skor_PGK', 'Skor_Esai', 'Nilai_Akhir', 'Status',
      'Jawaban_JSON', 'Skor_Esai_JSON', 'Percobaan'
    ]);
    var shSoal = getOrCreateSheet(ss, 'Bank_Soal', ['No', 'Data_JSON']);

    if (action === 'submitExam') {
      if (payload.student) {
        var st = payload.student;
        var sRows = shSiswa.getDataRange().getValues();
        var sIdx = -1;
        for (var i = 1; i < sRows.length; i++) {
          if (String(sRows[i][0]) === String(st.id)) { sIdx = i + 1; break; }
        }
        var stRow = [st.id, st.nis, st.name, st.kelas, st.gender || 'L'];
        if (sIdx > 0) shSiswa.getRange(sIdx, 1, 1, 5).setValues([stRow]);
        else shSiswa.appendRow(stRow);
      }
      var targetCls = null;
      if (payload.submission) {
        var sub = payload.submission;
        targetCls = sub.kelas;
        var nRows = shNilai.getDataRange().getValues();
        var nIdx = -1;
        for (var j = 1; j < nRows.length; j++) {
          if (String(nRows[j][1]) === String(sub.studentId)) { nIdx = j + 1; break; }
        }
        var attemptNum = Number(sub.attemptCount) || 1;
        if (nIdx > 0) {
          var prevScore = Number(nRows[nIdx - 1][9]) || 0;
          var prevAttempt = Number(nRows[nIdx - 1][13]) || 1;
          attemptNum = Math.min(2, Math.max(attemptNum, prevAttempt));
          if (Number(sub.totalScore) < prevScore) {
            shNilai.getRange(nIdx, 14).setValue(attemptNum);
          } else {
            var subRowUpdate = [
              sub.id, sub.studentId, sub.studentName, sub.kelas, sub.submittedAt, sub.durationUsed,
              sub.pgScore, sub.pgkScore, sub.essayScore, sub.totalScore,
              sub.totalScore >= KKTP_SCORE ? 'Tuntas' : 'Remedial',
              JSON.stringify(sub.answers || {}),
              JSON.stringify(sub.essayScores || {}),
              attemptNum
            ];
            shNilai.getRange(nIdx, 1, 1, 14).setValues([subRowUpdate]);
          }
        } else {
          var subRowNew = [
            sub.id, sub.studentId, sub.studentName, sub.kelas, sub.submittedAt, sub.durationUsed,
            sub.pgScore, sub.pgkScore, sub.essayScore, sub.totalScore,
            sub.totalScore >= KKTP_SCORE ? 'Tuntas' : 'Remedial',
            JSON.stringify(sub.answers || {}),
            JSON.stringify(sub.essayScores || {}),
            attemptNum
          ];
          shNilai.appendRow(subRowNew);
        }
      }
      var currentAll = readAllFromSheets(ss);
      var qSource = (Array.isArray(payload.questionsMeta) && payload.questionsMeta.length > 0)
        ? payload.questionsMeta
        : currentAll.questions;
      rebuildClassReports(ss, targetCls ? [targetCls] : null, currentAll.students, currentAll.submissions, qSource);
      return jsonResponse({
        ok: true,
        spreadsheetName: ss.getName(),
        spreadsheetUrl: ss.getUrl(),
        message: 'Nilai & Analisis Kelas ' + (targetCls || '') + ' tersimpan di Spreadsheet.'
      });
    }

    if (action === 'saveStudents' || action === 'saveAll') {
      if (Array.isArray(payload.students)) {
        shSiswa.clearContents();
        var outS = [['ID', 'NIS', 'Nama', 'Kelas', 'JK']];
        payload.students.forEach(function(st) {
          outS.push([st.id, st.nis, st.name, st.kelas, st.gender || 'L']);
        });
        shSiswa.getRange(1, 1, outS.length, 5).setValues(outS);
        shSiswa.getRange(1, 1, 1, 5).setFontWeight('bold');
      }
    }

    if (action === 'saveSubmissions' || action === 'saveAll') {
      if (Array.isArray(payload.submissions)) {
        shNilai.clearContents();
        var outN = [[
          'ID', 'StudentID', 'Nama', 'Kelas', 'Waktu', 'Durasi',
          'Skor_PG', 'Skor_PGK', 'Skor_Esai', 'Nilai_Akhir', 'Status',
          'Jawaban_JSON', 'Skor_Esai_JSON', 'Percobaan'
        ]];
        payload.submissions.forEach(function(sub) {
          outN.push([
            sub.id, sub.studentId, sub.studentName, sub.kelas, sub.submittedAt, sub.durationUsed,
            sub.pgScore, sub.pgkScore, sub.essayScore, sub.totalScore,
            sub.totalScore >= KKTP_SCORE ? 'Tuntas' : 'Remedial',
            JSON.stringify(sub.answers || {}),
            JSON.stringify(sub.essayScores || {}),
            Number(sub.attemptCount) || 1
          ]);
        });
        shNilai.getRange(1, 1, outN.length, 14).setValues(outN);
        shNilai.getRange(1, 1, 1, 14).setFontWeight('bold');
      }
    }

    if (action === 'saveQuestions' || action === 'saveAll') {
      if (Array.isArray(payload.questions)) {
        shSoal.clearContents();
        var outQ = [['No', 'Data_JSON']];
        payload.questions.forEach(function(q) {
          outQ.push([q.no, JSON.stringify(q)]);
        });
        shSoal.getRange(1, 1, outQ.length, 2).setValues(outQ);
        shSoal.getRange(1, 1, 1, 2).setFontWeight('bold');
      }
    }

    if (action === 'saveAll' || action === 'saveSubmissions') {
      var updatedAll = readAllFromSheets(ss);
      var qList = (Array.isArray(payload.questions) && payload.questions.length > 0)
        ? payload.questions
        : (Array.isArray(payload.questionsMeta) && payload.questionsMeta.length > 0 ? payload.questionsMeta : updatedAll.questions);
      rebuildClassReports(ss, null, updatedAll.students, updatedAll.submissions, qList);
    }

    return jsonResponse({
      ok: true,
      spreadsheetName: ss.getName(),
      spreadsheetUrl: ss.getUrl(),
      message: 'Nilai & Analisis berhasil disinkronkan ke Spreadsheet!'
    });
  } catch (err) {
    return jsonResponse({ ok: false, error: err.message });
  } finally {
    lock.releaseLock();
  }
}`;

    function updateCloudStatusUI() {
      const sbDot = document.getElementById('sidebar-sync-dot');
      const tbDot = document.getElementById('topbar-sync-dot');
      const tbLabel = document.getElementById('topbar-sync-label');

      let dotCls = 'bg-slate-400';

    async function cloudPost(payload, silent = true) {
      if (!cloudState.url) return { ok: false, skipped: true };
      cloudState.status = 'syncing';
      cloudState.lastError = '';
      updateCloudStatusUI();
      try {
        const res = await fetch(cloudState.url, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch (parseErr) {
          throw new Error('Apps Script mengembalikan respon non-JSON. Pastikan sudah Deploy sebagai Aplikasi Web dengan akses "Siapa saja".');
        }
        if (data && data.ok) {
          cloudState.status = 'connected';
          cloudState.lastSync = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          if (data.spreadsheetName) cloudState.spreadsheetName = data.spreadsheetName;
          if (data.spreadsheetUrl) cloudState.spreadsheetUrl = data.spreadsheetUrl;
          updateCloudStatusUI();
          if (!silent) showToast(data.message || 'Data tersimpan ke Google Spreadsheet!');
          return { ok: true, data };
        }
        throw new Error(data?.error || 'Respon server tidak valid');
      } catch (err) {
        if (err instanceof TypeError) {
          try {
            await fetch(cloudState.url, {
              method: 'POST',
              mode: 'no-cors',
              redirect: 'follow',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });
            cloudState.status = 'connected';
            cloudState.lastSync = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            updateCloudStatusUI();
            if (!silent) showToast('Data dikirim ke Google Spreadsheet!', 'info');
            return { ok: true, opaque: true };
          } catch (e2) {}
        }
        cloudState.status = 'error';
        cloudState.lastError = err.message;
        updateCloudStatusUI();
        if (!silent) showToast('Gagal sinkron: ' + err.message, 'error');
        return { ok: false, error: err.message };
      }
    }

    async function syncPullFromSheet(silent = false) {
      if (!cloudState.url) {
        if (!silent) showToast('URL Google Spreadsheet belum diatur.', 'warning');
        return false;
      }
      cloudState.status = 'syncing';
      cloudState.lastError = '';
      updateCloudStatusUI();
      try {
        const sep = cloudState.url.includes('?') ? '&' : '?';
        const res = await fetch(`${cloudState.url}${sep}action=loadAll`, { redirect: 'follow' });
        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch (e) {
          throw new Error('Respon bukan JSON. Pastikan Apps Script di-Deploy sebagai Aplikasi Web (Siapa saja).');
        }
        if (!data || !data.ok) throw new Error(data?.error || 'Gagal memuat data Spreadsheet');

        if (data.spreadsheetName) cloudState.spreadsheetName = data.spreadsheetName;
        if (data.spreadsheetUrl) cloudState.spreadsheetUrl = data.spreadsheetUrl;

        if (Array.isArray(data.students) && data.students.length > 0) appState.students = data.students;
        if (Array.isArray(data.submissions) && data.submissions.length > 0) appState.submissions = data.submissions;
        if (Array.isArray(data.questions) && data.questions.length === 45) appState.questions = data.questions;

        saveState();
        cloudState.status = 'connected';
        cloudState.lastSync = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        updateCloudStatusUI();

        if (!document.getElementById('teacher-app').classList.contains('hidden')) {
          switchTab(appState.activeTab);
        } else if (examState.phase === 'login') {
          renderStudentExam();
        }
        if (!silent) showToast(`Data berhasil ditarik dari Spreadsheet (${data.spreadsheetName || 'Cloud'})!`);
        return true;
      } catch (err) {
        cloudState.status = 'error';
        cloudState.lastError = err.message;
        updateCloudStatusUI();
        if (!silent) showToast('Gagal menarik data: ' + err.message, 'error');
        return false;
      }
    }

    async function manualSaveAllData() {
      const topbarBtn = document.getElementById('topbar-save-btn');
      const sidebarBtn = document.getElementById('sidebar-save-btn');
      const topbarLabel = document.getElementById('topbar-save-label');
      const sidebarLabel = document.getElementById('sidebar-save-label');

      if (topbarLabel) topbarLabel.textContent = 'Menyimpan...';
      if (sidebarLabel) sidebarLabel.textContent = 'Menyimpan...';
      if (topbarBtn) topbarBtn.disabled = true;
      if (sidebarBtn) sidebarBtn.disabled = true;

      // 1. Simpan ke local storage
      saveState();

      let cloudSuccess = false;
      let cloudMsg = '';

      // 2. Sinkronkan ke Google Spreadsheet jika URL aktif
      if (cloudState.url) {
        try {
          const res = await syncPushAllToSheet(true);
          if (res && res.ok) {
            cloudSuccess = true;
          } else {
            cloudMsg = (res && res.error) ? res.error : 'Koneksi spreadsheet tertunda';
          }
        } catch (e) {
          cloudMsg = e.message || 'Gagal sinkron';
        }
      }

      // Beri efek visual sukses
      if (topbarLabel) topbarLabel.textContent = 'Tersimpan! ✓';
      if (sidebarLabel) sidebarLabel.textContent = 'Tersimpan! ✓';
      if (topbarBtn) {
        topbarBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        topbarBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
      }
      if (sidebarBtn) {
        sidebarBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
        sidebarBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
      }

      if (cloudState.url) {
        if (cloudSuccess) {
          showToast('✓ Data berhasil disimpan ke penyimpanan lokal & disinkronkan ke Google Spreadsheet!', 'success');
        } else {
          showToast(`Data aman disimpan di perangkat lokal. (${cloudMsg})`, 'warning');
        }
      } else {
        showToast('✓ Seluruh perubahan data berhasil disimpan dengan aman di penyimpanan lokal!', 'success');
      }

      setTimeout(() => {
        if (topbarLabel) topbarLabel.textContent = 'Simpan Data';
        if (sidebarLabel) sidebarLabel.textContent = 'Simpan Perubahan Data';
        if (topbarBtn) {
          topbarBtn.disabled = false;
          topbarBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
          topbarBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
        }
        if (sidebarBtn) {
          sidebarBtn.disabled = false;
          sidebarBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
          sidebarBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
        }
      }, 1600);

      // Refresh tampilan tab saat ini
      if (appState.activeTab) {
        switchTab(appState.activeTab);
      }
    }

      cloudState.status = 'syncing';
      updateCloudStatusUI();
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}action=ping`, { redirect: 'follow' });

        let data = null;

        if (data && data.ok) {

        cloudState.lastError = err.message;
        updateCloudStatusUI();
        showToast('Koneksi gagal: ' + err.message, 'error');

    function normalizeClassName(raw) {
      if (!raw) return '9A';
      let s = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (s.startsWith('IX')) s = '9' + s.slice(2);
      return CLASSES.includes(s) ? s : '9A';
    }

      switchTab(appState.activeTab);

    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white',
        info: 'bg-indigo-600 text-white',
        warning: 'bg-amber-500 text-white',
        error: 'bg-rose-600 text-white'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-semibold flex items-center gap-2 transition-all duration-300 ${colors[type] || colors.success}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function openModal(html) {
      const modal = document.getElementById('global-modal');
      const content = document.getElementById('global-modal-content');
      content.innerHTML = html;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('global-modal').classList.add('hidden');
    }

    function toggleMobileSidebar(show) {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebar-overlay');
      if (show) {
        sb.classList.remove('-translate-x-full');
        ov.classList.remove('hidden');
      } else {
        sb.classList.add('-translate-x-full');
        ov.classList.add('hidden');
      }
    }

    function destroyCharts() {
      Object.keys(appState.charts).forEach(k => {
        try { if (appState.charts[k]) appState.charts[k].destroy(); } catch (e) {}
      });
      appState.charts = {};
    }

    function downloadCSV(filename, rows) {
      const csvContent = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(`File ${filename} berhasil diunduh!`);
    }

    function shuffleAllOptions() {
      appState.questions.forEach(q => {
        if (q.type === 'ESSAY') return;
        const indexed = q.options.map((text, idx) => ({ text, oldIdx: idx }));
        for (let i = indexed.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
        }
        q.options = indexed.map(x => x.text);
        if (q.type === 'PG') {
          q.answer = indexed.findIndex(x => x.oldIdx === q.answer);
        } else if (q.type === 'PGK') {
          q.answers = q.answers.map(oldA => indexed.findIndex(x => x.oldIdx === oldA)).sort((a, b) => a - b);
        }
      });
      saveState();
      cloudPost({ action: 'saveQuestions', questions: appState.questions }, true);
      renderBankSoal(document.getElementById('main-view'));
      showToast('Urutan opsi jawaban untuk 40 soal PG & PGK berhasil diacak!');
    }

    function saveEditedQuestion(e, no, originTab = 'soal') {
      e.preventDefault();
      const q = appState.questions.find(item => item.no === no);
      if (!q) return;

      q.question = document.getElementById('edit-q-text').value.trim();
      q.explanation = document.getElementById('edit-q-exp')?.value.trim() || '';

      if (q.type !== 'ESSAY') {
        q.options = [0, 1, 2, 3].map(idx => document.getElementById(`edit-q-opt-${idx}`).value.trim());
        const checkedVals = Array.from(document.querySelectorAll('input[name="edit-q-ans"]:checked')).map(el => Number(el.value));
        if (q.type === 'PG') {
          if (checkedVals.length !== 1) return showToast('Pilih tepat 1 kunci jawaban benar!', 'warning');
          q.answer = checkedVals[0];
        } else {
          if (checkedVals.length !== 2) return showToast('Soal PGK wajib memiliki tepat 2 kunci jawaban benar!', 'warning');
          q.answers = checkedVals.sort((a, b) => a - b);
        }
      } else {
        q.sampleAnswer = document.getElementById('edit-q-sample').value.trim();
      }

      const shouldRecalc = document.getElementById('edit-q-recalc')?.checked;
      saveState();
      cloudPost({ action: 'saveQuestions', questions: appState.questions }, true);

      if (shouldRecalc) {
        recalculateAllSubmissions(true);
      }

      closeModal();
      if (originTab === 'analisis') {
        renderAnalisisNilai(document.getElementById('main-view'));
      } else {
        renderBankSoal(document.getElementById('main-view'));
      }
      showToast(`Soal nomor ${no} berhasil diperbarui!${shouldRecalc ? ' Nilai siswa dihitung ulang.' : ''}`);
    }

        const matchKelas = activeKelas === 'ALL' || st.kelas === activeKelas;
        return matchSearch && matchKelas;

    function extractClassFromFilename(filename) {
      if (!filename) return null;
      const match = String(filename).match(/(?:^|[^A-Z0-9])(9|IX)[\s_-]*([A-K])(?:$|[^A-Z0-9])/i);
      if (match) return '9' + match[2].toUpperCase();
      return null;
    }

    function parseSheetToStudents(sheet, fallbackClass) {
      const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (!matrix.length) return [];

      let headerIdx = -1;
      let nameCol = -1, nisCol = -1, kelasCol = -1, jkCol = -1;

      const scanLimit = Math.min(20, matrix.length);
      for (let r = 0; r < scanLimit; r++) {
        const row = matrix[r];
        if (!Array.isArray(row)) continue;
        const lowerCells = row.map(c => String(c ?? '').trim().toLowerCase());
        let foundName = lowerCells.findIndex(c =>
          c.includes('nama') &&
          !c.includes('ibu') &&
          !c.includes('ayah') &&
          !c.includes('wali') &&
          !c.includes('sekolah') &&
          !c.includes('madrasah') &&
          !c.includes('orang tua')
        );
        if (foundName === -1) {
          foundName = lowerCells.findIndex(c => c === 'siswa' || c === 'peserta' || c === 'peserta didik');
        }
        if (foundName !== -1) {
          headerIdx = r;
          nameCol = foundName;
          nisCol = lowerCells.findIndex(c => c === 'nis' || c === 'nisn' || c.includes('nis') || c.includes('induk'));
          kelasCol = lowerCells.findIndex(c => c.includes('kelas') || c.includes('rombel'));
          jkCol = lowerCells.findIndex(c => c === 'jk' || c === 'l/p' || c === 'l / p' || c.includes('kelamin') || c.includes('gender'));
          break;
        }
      }

      if (headerIdx === -1 || nameCol === -1) return [];

      const results = [];
      for (let r = headerIdx + 1; r < matrix.length; r++) {
        const row = matrix[r];
        if (!Array.isArray(row)) continue;
        const name = String(row[nameCol] ?? '').trim();
        if (!name || name.length < 2 || /^\d+$/.test(name)) continue;
        if (name.toLowerCase() === 'nama' || name.toLowerCase() === 'nama lengkap' || name.toLowerCase() === 'nama siswa') continue;

        const rawNis = nisCol >= 0 ? String(row[nisCol] ?? '').trim() : '';
        const nis = rawNis || ('2026' + String(Date.now() + r).slice(-5));

        const rawKelas = kelasCol >= 0 ? String(row[kelasCol] ?? '').trim() : '';
        let kelas = fallbackClass;
        if (rawKelas) {
          const detected = extractClassFromFilename(rawKelas);
          if (detected) kelas = detected;
          else if (CLASSES.includes(normalizeClassName(rawKelas))) kelas = normalizeClassName(rawKelas);
        }

        const rawJk = jkCol >= 0 ? String(row[jkCol] ?? '').trim().toUpperCase() : '';
        const gender = (rawJk.startsWith('P') || rawJk.startsWith('W')) ? 'P' : 'L';

        results.push({ nis, name, kelas, gender });
      }
      return results;
    }

    async function handleExcelFileUpload(e) {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      if (typeof XLSX === 'undefined') {
        showToast('Library SheetJS tidak tersedia. Periksa koneksi internet.', 'error');
        return;
      }

      const defaultCls = document.getElementById('excel-default-kelas').value;
      const previewBox = document.getElementById('excel-preview-box');
      const previewInfo = document.getElementById('excel-preview-info');
      const summaryBox = document.getElementById('excel-class-summary');
      const tbody = document.getElementById('excel-preview-tbody');
      const btn = document.getElementById('btn-confirm-excel');

      try {
        const readOneFile = (file) => new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            try {
              const data = new Uint8Array(evt.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const fileRows = [];
              workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                const clsFromSheet = extractClassFromFilename(sheetName) || extractClassFromFilename(file.name) || defaultCls;
                const parsed = parseSheetToStudents(sheet, clsFromSheet);
                fileRows.push(...parsed);
              });
              resolve(fileRows);
            } catch (err) {
              console.warn('Gagal membaca file:', file.name, err);
              resolve([]);
            }
          };
          reader.onerror = () => resolve([]);
          reader.readAsArrayBuffer(file);
        });

        const allArrays = await Promise.all(files.map(readOneFile));
        pendingExcelRows = allArrays.flat();

        if (pendingExcelRows.length === 0) {
          showToast('Tidak ditemukan data siswa valid. Pastikan ada kolom "Nama".', 'error');
          previewBox.classList.add('hidden');
          btn.disabled = true;
          return;
        }

        const perClass = {};
        pendingExcelRows.forEach(r => { perClass[r.kelas] = (perClass[r.kelas] || 0) + 1; });
        const sortedClasses = Object.keys(perClass).sort();

        previewInfo.textContent = `Berhasil membaca ${files.length} file — Total ${pendingExcelRows.length} siswa siap diimpor:`;
        summaryBox.innerHTML = sortedClasses.map(c =>
          `<span class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-[11px] font-bold">${c}: ${perClass[c]} siswa</span>`
        ).join('');

        tbody.innerHTML = pendingExcelRows.slice(0, 50).map(r => `
          <tr>
            <td class="px-3 py-2 font-mono text-slate-600">${escapeHtml(r.nis)}</td>
            <td class="px-3 py-2 font-semibold text-slate-900">${escapeHtml(r.name)}</td>
            <td class="px-3 py-2 text-center font-bold text-indigo-700">${escapeHtml(r.kelas)}</td>
            <td class="px-3 py-2 text-center">${escapeHtml(r.gender)}</td>
          </tr>
        `).join('');
        previewBox.classList.remove('hidden');
        btn.disabled = false;
      } catch (err) {
        showToast('Gagal membaca file Excel.', 'error');
      }
    }

    function confirmImportExcel() {
      if (!pendingExcelRows.length) return;
      const replaceMode = document.getElementById('excel-replace-mode')?.checked;
      const importedClasses = [...new Set(pendingExcelRows.map(r => r.kelas))].sort();

      if (replaceMode) {
        appState.students = appState.students.filter(s => !importedClasses.includes(s.kelas));
        appState.submissions = appState.submissions.filter(s => !importedClasses.includes(s.kelas));
      }

      const baseTime = Date.now();
      pendingExcelRows.forEach((r, idx) => {
        appState.students.push({
          id: 'SX' + (baseTime + idx),
          nis: r.nis,
          name: r.name,
          kelas: r.kelas,
          gender: r.gender
        });
      });

      const count = pendingExcelRows.length;
      pendingExcelRows = [];
      saveState();
      cloudPost({ action: 'saveAll', students: appState.students, submissions: appState.submissions }, false);
      closeModal();
      appState.siswaKelasFilter = importedClasses.length === 1 ? importedClasses[0] : 'ALL';
      renderDataSiswa(document.getElementById('main-view'));
      showToast(`${count} siswa (${importedClasses.join(', ')}) berhasil diimpor & disinkronkan!`);
    }

      e.preventDefault();
      const sub = appState.submissions.find(s => s.id === subId);

      if (!sub.essayScores) sub.essayScores = {};
      let essayTotal = 0;
      [41, 42, 43, 44, 45].forEach(no => {
        const val = Math.min(4, Math.max(0, Number(document.getElementById(`grade-q-${no}`).value) || 0));
        sub.essayScores[no] = val;
        essayTotal += val;
      });
      sub.essayScore = essayTotal;
      sub.totalScore = sub.pgScore + sub.pgkScore + sub.essayScore;
      saveState();
      cloudPost({ action: 'saveSubmissions', submissions: appState.submissions, questionsMeta: getQuestionsMeta() }, true);
      closeModal();
      renderDaftarNilai(document.getElementById('main-view'));
      showToast(`Nilai esai ${sub.studentName} diperbarui! Nilai akhir: ${sub.totalScore}`);
    }

    function updateEditSubTotal() {
      const pg = Number(document.getElementById('edit-sub-pg')?.value) || 0;
      const pgk = Number(document.getElementById('edit-sub-pgk')?.value) || 0;
      const es = Number(document.getElementById('edit-sub-essay')?.value) || 0;
      const total = Math.min(100, Math.max(0, pg + pgk + es));
      const el = document.getElementById('edit-sub-total-preview');
      if (el) el.textContent = total;
    }

    function saveEditedNilai(e, subId) {
      e.preventDefault();
      const sub = appState.submissions.find(s => s.id === subId);
      if (!sub) return;

      sub.studentName = document.getElementById('edit-sub-name').value.trim();
      sub.kelas = document.getElementById('edit-sub-kelas').value;
      sub.pgScore = Math.min(60, Math.max(0, Number(document.getElementById('edit-sub-pg').value) || 0));
      sub.pgkScore = Math.min(20, Math.max(0, Number(document.getElementById('edit-sub-pgk').value) || 0));
      sub.essayScore = Math.min(20, Math.max(0, Number(document.getElementById('edit-sub-essay').value) || 0));
      sub.totalScore = sub.pgScore + sub.pgkScore + sub.essayScore;
      sub.attemptCount = Number(document.getElementById('edit-sub-attempt').value) || 1;
      sub.durationUsed = document.getElementById('edit-sub-duration').value.trim();

      // Selaraskan ke Data Siswa jika nama/kelas berubah
      const st = appState.students.find(s => s.id === sub.studentId);
      if (st) {
        st.name = sub.studentName;
        st.kelas = sub.kelas;
      }

      saveState();
      cloudPost({ action: 'saveSubmissions', submissions: appState.submissions, questionsMeta: getQuestionsMeta() }, true);
      closeModal();
      renderDaftarNilai(document.getElementById('main-view'));
      showToast(`Data nilai siswa ${sub.studentName} (${sub.kelas}) berhasil diperbarui! Nilai: ${sub.totalScore}`);
    }

    function exportNilaiCSV() {
      const activeKelas = appState.nilaiKelasFilter;
      const list = activeKelas === 'ALL' ? appState.submissions : appState.submissions.filter(s => s.kelas === activeKelas);
      const rows = [['Nama Siswa', 'Kelas', 'Skor PG (60)', 'Skor PGK (20)', 'Skor Esai (20)', 'Nilai Akhir', 'Predikat', 'Status', 'Percobaan']];
      list.forEach(s => {
        const pred = getPredikat(s.totalScore);
        rows.push([
          s.studentName, s.kelas, s.pgScore, s.pgkScore, s.essayScore, s.totalScore,
          pred.label, s.totalScore >= appSettings.kktp ? 'Tuntas' : 'Remedial', s.attemptCount || 1
        ]);
      });
      const suffix = activeKelas === 'ALL' ? 'Semua_Kelas' : 'Kelas_' + activeKelas;
      downloadCSV(`Daftar_Nilai_Asesmen_Informatika_${suffix}.csv`, rows);

    function setAnalisisKelas(cls) {

    function renderAnalisisNilai(container) {
      const activeKelas = appState.analisisKelasFilter;
      const countMap = { ALL: appState.submissions.length };
      CLASSES.forEach(c => { countMap[c] = appState.submissions.filter(s => s.kelas === c).length; });

      const subs = activeKelas === 'ALL'
        ? appState.submissions
        : appState.submissions.filter(s => s.kelas === activeKelas);

      const scores = subs.map(s => s.totalScore).sort((a, b) => a - b);
      const maxScore = scores.length ? Math.max(...scores) : 0;
      const minScore = scores.length ? Math.min(...scores) : 0;
      const avgScore = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '0.0';
      const median = scores.length
        ? (scores.length % 2 === 1 ? scores[Math.floor(scores.length / 2)] : ((scores[scores.length / 2 - 1] + scores[scores.length / 2]) / 2).toFixed(1))
        : 0;

      const tuntasCount = subs.filter(s => s.totalScore >= appSettings.kktp).length;
      const tuntasPct = subs.length ? Math.round((tuntasCount / subs.length) * 100) : 0;

      const itemAnalysis = appState.questions.map(q => {
        let totalEarned = 0;
        const maxPerStudent = q.type === 'ESSAY' ? 4 : 2;
        subs.forEach(s => {
          if (q.type === 'PG') {
            if (s.answers?.[q.no] === q.answer) totalEarned += 2;
          } else if (q.type === 'PGK') {
            const ans = s.answers?.[q.no] || [];
            const correctCount = ans.filter(a => q.answers.includes(a)).length;
            const wrongCount = ans.filter(a => !q.answers.includes(a)).length;
            if (correctCount === 2 && wrongCount === 0) totalEarned += 2;
            else if (correctCount === 1 && ans.length <= 2) totalEarned += 1;
          } else {
            totalEarned += (s.essayScores?.[q.no] ?? 0);
          }
        });

        const pct = subs.length ? Math.round((totalEarned / (subs.length * maxPerStudent)) * 100) : 0;
        let difficulty = 'Sedang', diffCls = 'bg-amber-50 text-amber-700', action = 'Dipertahankan';
        if (subs.length === 0) {
          difficulty = '-'; diffCls = 'bg-slate-100 text-slate-500'; action = 'Belum ada data';
        } else if (pct >= appSettings.diffEasy) {
          difficulty = 'Mudah'; diffCls = 'bg-emerald-50 text-emerald-700'; action = 'Baik / Pengayaan';
        } else if (pct < appSettings.diffHard) {
          difficulty = 'Sukar'; diffCls = 'bg-rose-50 text-rose-700'; action = 'Perlu Remedial / Evaluasi Kunci';
        }

        const customRec = appSettings.customRecommendations?.[q.no];
        if (customRec) action = customRec;

        return { ...q, pct, difficulty, diffCls, action };
      });
      window._lastItemAnalysis = itemAnalysis;

      const bloomStats = { C1: [], C2: [], C3: [], C4: [] };
      const typeStats = { PG: [], PGK: [], ESSAY: [] };
      itemAnalysis.forEach(item => {
        if (bloomStats[item.level]) bloomStats[item.level].push(item.pct);
        if (typeStats[item.type]) typeStats[item.type].push(item.pct);
      });
      const avgArr = arr => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
      const bloomAvg = ['C1', 'C2', 'C3', 'C4'].map(lvl => avgArr(bloomStats[lvl]));
      const typeAvg = ['PG', 'PGK', 'ESSAY'].map(tp => avgArr(typeStats[tp]));

    /*************************************************************************
     * 12. MODE UJIAN SISWA (HP): ANTI-DATA LOSS, AUTO-SAVE SESSION,
     * FULLSCREEN, 2 PERCOBAAN & TERKUNCI OTOMATIS
     *************************************************************************/
    function hashStringToSeed(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function createSeededRng(seed) {
      let a = seed >>> 0;
      return function() {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffleWithRng(list, rng) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildStudentQuestionOrder(studentName, kelas) {
      const seedKey = `${String(studentName || '').trim().toLowerCase()}|${String(kelas || '').trim().toUpperCase()}`;
      const rng = createSeededRng(hashStringToSeed(seedKey));
      const pg = appState.questions.filter(q => q.type === 'PG');
      const pgk = appState.questions.filter(q => q.type === 'PGK');
      const essay = appState.questions.filter(q => q.type === 'ESSAY');
      return [
        ...shuffleWithRng(pg, rng),
        ...shuffleWithRng(pgk, rng),
        ...shuffleWithRng(essay, rng)
      ];
    }

    function autoSaveExamSession() {
      if (examState.phase !== 'running') return;
      try {
        const sessionData = {
          studentId: examState.studentId,
          studentName: examState.studentName,
          kelas: examState.kelas,
          attemptNumber: examState.attemptNumber,
          currentIndex: examState.currentIndex,
          answers: examState.answers,
          flagged: examState.flagged,
          remainingSeconds: examState.remainingSeconds,
          timestamp: Date.now()
        };
        localStorage.setItem(EXAM_SESSION_KEY, JSON.stringify(sessionData));
      } catch (e) {}
    }

    function clearExamSession() {
      try { localStorage.removeItem(EXAM_SESSION_KEY); } catch (e) {}
    }

    function checkActiveExamSession() {
      try {
        const raw = localStorage.getItem(EXAM_SESSION_KEY);
        if (raw) {
          const session = JSON.parse(raw);
          if (session && session.studentName && session.remainingSeconds > 10) {
            return session;
          }
        }
      } catch (e) {}
      return null;
    }

    function resumeActiveExamSession(session) {
      examState.studentId = session.studentId;
      examState.studentName = session.studentName;
      examState.kelas = session.kelas;
      examState.attemptNumber = session.attemptNumber || 1;
      examState.currentIndex = session.currentIndex || 0;
      examState.answers = session.answers || {};
      examState.flagged = session.flagged || {};
      examState.remainingSeconds = session.remainingSeconds || (90 * 60);
      examState.questionOrder = buildStudentQuestionOrder(session.studentName, session.kelas);
      examState.phase = 'running';
      examState.studentTab = 'soal';
      examState.showNavGrid = false;
      startExamTimer();
      renderStudentExam();
      showToast(`Sesi ujian ${session.studentName} berhasil dipulihkan! Jawaban aman tersimpan.`);
    }

    function switchStudentTab(tab) {

      const root = document.getElementById('student-exam-app');
      if (root) root.scrollTo({ top: 0, behavior: 'smooth' });

    function openExamQuestionByNo(originalNo) {
      const list = examState.questionOrder.length ? examState.questionOrder : appState.questions;
      const idx = list.findIndex(item => item.no === originalNo);
      examState.currentIndex = idx >= 0 ? idx : 0;
      switchStudentTab('soal');
    }

    function formatTimer(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

          q.materi.toLowerCase().includes(kw) ||
          q.indikator.toLowerCase().includes(kw) ||
          q.cp.toLowerCase().includes(kw) ||
          String(q.no) === kw;
        return matchType && matchSearch;

                      const selected = examState.answers[q.no] === idx;
                      return `
                        <button type="button" ${examState.isReadOnly ? '' : `onclick="selectPGAnswer(${q.no}, ${idx})"`} class="w-full text-left p-3.5 rounded-2xl border-2 transition flex items-start gap-3 ${examState.isReadOnly ? 'cursor-default' : 'active:scale-[0.99] cursor-pointer'} min-h-[52px] ${
                          selected
                            ? 'bg-indigo-50 border-indigo-600 text-indigo-950 font-semibold shadow-xs'
                            : (examState.isReadOnly ? 'bg-white border-slate-200 text-slate-700 opacity-80' : 'bg-white border-slate-200 hover:border-indigo-300 text-slate-700')
                        }">
                          <span class="w-7 h-7 rounded-xl shrink-0 flex items-center justify-center text-xs font-extrabold ${
                            selected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
                          }">${OPTION_LETTERS[idx]}</span>
                          <span class="text-sm leading-snug pt-0.5">${escapeHtml(opt)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                ` : q.type === 'PGK' ? `
                  <div class="space-y-2.5 pt-1">
                    <div class="flex items-center justify-between text-xs font-bold text-purple-700 bg-purple-50 border border-purple-200 rounded-xl px-3 py-2">
                      <span>Pilih tepat 2 jawaban</span>
                      <span class="px-2 py-0.5 rounded-md ${currentPgkAns.length === 2 ? 'bg-purple-600 text-white' : 'bg-purple-200 text-purple-800'}">${currentPgkAns.length}/2 dipilih</span>
                    </div>
                    ${q.options.map((opt, idx) => {
                      const selected = currentPgkAns.includes(idx);
                      return `
                        <button type="button" ${examState.isReadOnly ? '' : `onclick="togglePGKAnswer(${q.no}, ${idx})"`} class="w-full text-left p-3.5 rounded-2xl border-2 transition flex items-start gap-3 ${examState.isReadOnly ? 'cursor-default' : 'active:scale-[0.99] cursor-pointer'} min-h-[52px] ${
                          selected
                            ? 'bg-purple-50 border-purple-600 text-purple-950 font-semibold shadow-xs'
                            : (examState.isReadOnly ? 'bg-white border-slate-200 text-slate-700 opacity-80' : 'bg-white border-slate-200 hover:border-purple-300 text-slate-700')
                        }">
                          <span class="w-7 h-7 rounded-xl shrink-0 flex items-center justify-center text-xs font-extrabold ${
                            selected ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-600'
                          }">${selected ? '✓' : OPTION_LETTERS[idx]}</span>
                          <span class="text-sm leading-snug pt-0.5">${escapeHtml(opt)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                ` : `
                  <div class="space-y-2 pt-1">
                    ${examState.isReadOnly ? `
                      <label class="block text-xs font-bold text-slate-600">Jawaban Esai Kamu (Terkunci / Mode Tinjau):</label>
                      <div class="w-full p-3.5 rounded-2xl border-2 border-slate-200 bg-slate-50 text-slate-800 text-sm leading-relaxed whitespace-pre-wrap min-h-[110px]">
                        ${escapeHtml(examState.answers[q.no] || '(Tidak ada jawaban esai yang tersimpan)')}
                      </div>
                    ` : `
                      <label class="block text-xs font-bold text-slate-600">Jawaban Esai Siswa (tersimpan otomatis saat diketik):</label>
                      <textarea rows="5" oninput="setEssayAnswer(${q.no}, this.value)" placeholder="Ketik jawaban kamu di sini..." class="w-full p-3.5 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-sm leading-relaxed">${escapeHtml(examState.answers[q.no] || '')}</textarea>
                    `}
                  </div>
                `}
              </div>

              <!-- Drawer Navigasi Nomor Soal -->
              ${examState.showNavGrid ? `
                <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm space-y-3">
                  <div class="flex items-center justify-between">
                    <p class="text-xs font-extrabold text-slate-800">Daftar Soal 1–${examQuestions.length}</p>
                    <button onclick="toggleNavGrid()" class="text-xs font-bold text-slate-500 hover:text-slate-800">Tutup ✕</button>
                  </div>
                  <div class="grid grid-cols-5 sm:grid-cols-9 gap-2">
                    ${examQuestions.map((item, idx) => {
                      const answered = isQuestionAnswered(item);
                      const flagged = !!examState.flagged[item.no];
                      const active = idx === examState.currentIndex;
                      let cls = 'bg-slate-100 text-slate-600 border-slate-200';
                      if (flagged) cls = 'bg-amber-400 text-amber-950 border-amber-500';
                      else if (answered) cls = 'bg-emerald-500 text-white border-emerald-600';
                      if (active) cls += ' ring-2 ring-indigo-600 ring-offset-2';
                      return `<button onclick="goToQuestion(${idx})" class="h-10 rounded-xl border text-xs font-bold transition flex items-center justify-center ${cls}">${idx + 1}</button>`;
                    }).join('')}
                  </div>
                  <div class="flex flex-wrap gap-3 text-[10px] font-semibold text-slate-500 pt-1">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-500"></span>Terjawab</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-400"></span>Ragu-ragu</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-slate-200"></span>Belum</span>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Sticky Bottom Navigation Footer -->
            <footer class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-3 max-w-2xl mx-auto flex items-center justify-between gap-2 shadow-lg">
              <button onclick="goToQuestion(${Math.max(0, examState.currentIndex - 1)})" ${examState.currentIndex === 0 ? 'disabled' : ''} class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 text-xs font-bold transition">
                ← Sebelum
              </button>
              <button onclick="toggleNavGrid()" class="px-3.5 py-2.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold transition flex items-center gap-1">
                <span>Daftar Soal</span>
                <span class="px-1.5 py-0.5 rounded-md bg-indigo-200 text-indigo-900 text-[10px]">${displayNo}/45</span>
              </button>
              ${examState.isReadOnly ? `
                <button onclick="logoutStudent()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold shadow-xs transition flex items-center gap-1.5">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                  <span>Selesai Meninjau</span>
                </button>
              ` : examState.currentIndex === examQuestions.length - 1 ? `
                <button onclick="openFinishExamModal()" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-xs transition">
                  Kumpulkan ✓
                </button>
              ` : `
                <button onclick="goToQuestion(${Math.min(examQuestions.length - 1, examState.currentIndex + 1)})" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs transition">
                  Berikutnya →
                </button>
              `}
            </footer>
          `}
        </div>
      `;
    }

    function syncStudentDropdownByClass(kelas) {
      examState.kelas = kelas;
      examState.studentId = '';
      examState.studentName = '';
      renderStudentExam();
    }

    function onSelectExamStudent(studentId) {
      examState.studentId = studentId;
      const st = appState.students.find(s => s.id === studentId);
      if (st) {
        examState.studentName = st.name;
        examState.kelas = st.kelas;
        const nameInput = document.getElementById('exam-student-name');
        if (nameInput) nameInput.value = st.name;
      }
    }

    function startStudentExam(e) {
      e.preventDefault();
      const kelas = document.getElementById('exam-student-kelas').value;
      const name = document.getElementById('exam-student-name').value.trim();
      const selectedId = document.getElementById('exam-student-select')?.value || '';

      if (!name || name.length < 2) {
        showToast('Masukkan nama lengkap kamu terlebih dahulu!', 'warning');
        return;
      }

      let st = selectedId
        ? appState.students.find(s => s.id === selectedId)
        : appState.students.find(s => s.name.trim().toLowerCase() === name.toLowerCase() && s.kelas === kelas);

      const existingSub = findExistingSubmission(st ? st.id : '', name, kelas);
      const prevAttempts = existingSub ? (Number(existingSub.attemptCount) || 1) : 0;

      if (prevAttempts >= MAX_ATTEMPTS) {
        // Siswa telah menyelesaikan batas maksimal 2x ujian:
        // Izinkan login tetapi hanya dalam Mode Tinjau (lihat soal & kisi-kisi, tidak bisa mengerjakan)
        examState.isReadOnly = true;
        examState.studentId = st ? st.id : (existingSub ? existingSub.studentId : ('S' + Date.now()));
        examState.studentName = st ? st.name : (existingSub ? existingSub.studentName : name);
        examState.kelas = kelas;
        examState.attemptNumber = MAX_ATTEMPTS;
        examState.previousSubmission = existingSub || null;
        examState.questionOrder = buildStudentQuestionOrder(examState.studentName, examState.kelas);
        examState.phase = 'running';
        examState.studentTab = 'soal';
        examState.currentIndex = 0;
        // Muat jawaban yang pernah dikirimkan agar siswa dapat melihat hasil pekerjaannya
        examState.answers = (existingSub && existingSub.answers) ? JSON.parse(JSON.stringify(existingSub.answers)) : {};
        examState.flagged = {};
        examState.remainingSeconds = 0;
        examState.showNavGrid = false;
        clearInterval(examState.timerHandle);
        clearExamSession();

        renderStudentExam();
        showToast('Mode Tinjau: Kamu telah menyelesaikan 2x ujian. Silakan membaca soal dan kisi-kisi.', 'info');
        return;
      }

      if (!st) {
        st = {
          id: 'S' + Date.now(),
          nis: '2026' + String(Date.now()).slice(-4),
          name,
          kelas,
          gender: 'L'
        };
        appState.students.push(st);
        saveState();
      }

      examState.studentId = st.id;
      examState.studentName = st.name;
      examState.kelas = st.kelas;
      examState.questionOrder = buildStudentQuestionOrder(st.name, st.kelas);
      examState.attemptNumber = prevAttempts + 1;
      examState.previousSubmission = existingSub || null;
      examState.phase = 'running';
      examState.studentTab = 'soal';
      examState.currentIndex = 0;
      examState.answers = {};
      examState.flagged = {};
      examState.remainingSeconds = 90 * 60;
      examState.showNavGrid = false;

      autoSaveExamSession();
      startExamTimer();
      renderStudentExam();
      showToast(
        examState.attemptNumber === 2
          ? 'Percobaan ke-2 dimulai! Nilai tertinggi yang akan dicatat di daftar nilai.'
          : 'Selamat mengerjakan Asesmen Informatika!'
      );
    }

    function startExamTimer() {
      clearInterval(examState.timerHandle);
      examState.timerHandle = setInterval(() => {
        if (examState.phase !== 'running') {
          clearInterval(examState.timerHandle);
          return;
        }
        examState.remainingSeconds--;
        const badge = document.getElementById('exam-timer-badge');
        if (badge) {
          badge.textContent = '⏱ ' + formatTimer(Math.max(0, examState.remainingSeconds));
          if (examState.remainingSeconds <= 300) {
            badge.classList.add('bg-rose-600');
          }
        }
        // Simpan sesi tiap 15 detik
        if (examState.remainingSeconds % 15 === 0) {
          autoSaveExamSession();
        }
        if (examState.remainingSeconds <= 0) {
          clearInterval(examState.timerHandle);
          submitStudentExam(true);
        }
      }, 1000);
    }

    function retrySecondAttempt() {
      const existingSub = findExistingSubmission(examState.studentId, examState.studentName, examState.kelas);
      if (existingSub && (Number(existingSub.attemptCount) || 1) >= MAX_ATTEMPTS) {
        showToast('Kesempatan mengerjakan (2/2) sudah selesai!', 'warning');
        return;
      }
      examState.attemptNumber = 2;
      examState.previousSubmission = existingSub || examState.previousSubmission;
      examState.questionOrder = buildStudentQuestionOrder(examState.studentName, examState.kelas);
      examState.phase = 'running';
      examState.studentTab = 'soal';
      examState.currentIndex = 0;
      examState.answers = {};
      examState.flagged = {};
      examState.remainingSeconds = 90 * 60;
      examState.showNavGrid = false;
      autoSaveExamSession();
      startExamTimer();
      renderStudentExam();
      showToast('Percobaan ke-2 dimulai! Nilai tertinggi akan otomatis disimpan.', 'info');
    }

    function isQuestionAnswered(q) {
      const ans = examState.answers[q.no];
      if (q.type === 'PG') return typeof ans === 'number';
      if (q.type === 'PGK') return Array.isArray(ans) && ans.length === 2;
      return typeof ans === 'string' && ans.trim().length > 0;
    }

    function selectPGAnswer(no, idx) {
      if (examState.isReadOnly) return;
      examState.answers[no] = idx;
      autoSaveExamSession();
      renderStudentExam();
    }

    function togglePGKAnswer(no, idx) {
      if (examState.isReadOnly) return;
      const curr = Array.isArray(examState.answers[no]) ? [...examState.answers[no]] : [];
      const pos = curr.indexOf(idx);
      if (pos >= 0) {
        curr.splice(pos, 1);
      } else {
        if (curr.length >= 2) {
          showToast('Maksimal 2 pilihan. Klik salah satu opsi terpilih untuk batal memilih.', 'warning');
          return;
        }
        curr.push(idx);
      }
      examState.answers[no] = curr.sort((a, b) => a - b);
      autoSaveExamSession();
      renderStudentExam();
    }

    function setEssayAnswer(no, val) {
      if (examState.isReadOnly) return;
      examState.answers[no] = val;
      autoSaveExamSession();
    }

    function toggleFlagQuestion(no) {
      if (examState.isReadOnly) return;
      examState.flagged[no] = !examState.flagged[no];
      autoSaveExamSession();
      renderStudentExam();
    }

    function toggleNavGrid() {
      examState.showNavGrid = !examState.showNavGrid;
      renderStudentExam();
    }

    function goToQuestion(idx) {
      examState.currentIndex = idx;
      examState.showNavGrid = false;
      autoSaveExamSession();
      renderStudentExam();
      const root = document.getElementById('student-exam-app');
      if (root) root.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openFinishExamModal() {
      const answeredCount = appState.questions.filter(q => isQuestionAnswered(q)).length;
      const unanswered = appState.questions.length - answeredCount;
      openModal(`
        <div class="p-6 text-center space-y-4">
          <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl font-extrabold">✓</div>
          <h3 class="text-lg font-extrabold text-slate-900">Kumpulkan Jawaban Ujian?</h3>
          <p class="text-sm text-slate-600">
            Kamu telah menjawab <strong>${answeredCount} dari 45 butir soal</strong>.
            ${unanswered > 0 ? `<span class="text-rose-600 font-semibold block mt-1">Perhatian: Masih ada ${unanswered} soal yang belum terjawab lengkap.</span>` : 'Semua soal sudah terjawab lengkap!'}
          </p>
          <div class="flex gap-3 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold">Periksa Lagi</button>
            <button onclick="closeModal(); submitStudentExam(false);" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-xs">Ya, Kumpulkan</button>
          </div>
        </div>
      `);
    }

    async function submitStudentExam(autoSubmit = false) {
      clearInterval(examState.timerHandle);
      clearExamSession();

      let pgScore = 0, pgkScore = 0, essayScore = 0;
      const essayScores = {};

      appState.questions.forEach(q => {
        if (q.type === 'PG') {
          if (examState.answers[q.no] === q.answer) pgScore += 2;
        } else if (q.type === 'PGK') {
          const ans = Array.isArray(examState.answers[q.no]) ? examState.answers[q.no] : [];
          const correctCount = ans.filter(a => q.answers.includes(a)).length;
          const wrongCount = ans.filter(a => !q.answers.includes(a)).length;
          if (correctCount === 2 && wrongCount === 0) pgkScore += 2;
          else if (correctCount === 1 && ans.length <= 2) pgkScore += 1;
        } else if (q.type === 'ESSAY') {
          const txt = String(examState.answers[q.no] || '').trim();
          const sc = txt.length >= 45 ? 4 : txt.length >= 20 ? 3 : txt.length >= 5 ? 2 : 0;
          essayScores[q.no] = sc;
          essayScore += sc;
        }
      });

      const currentAttemptScore = pgScore + pgkScore + essayScore;
      const elapsedSec = Math.max(60, 90 * 60 - examState.remainingSeconds);
      const durationUsed = `${Math.max(1, Math.round(elapsedSec / 60))} menit`;
      const nowStr = new Date().toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      }) + ' WIB';

      const newSub = {
        id: 'SUB-' + examState.studentId,
        studentId: examState.studentId,
        studentName: examState.studentName,
        kelas: examState.kelas,
        submittedAt: nowStr,
        durationUsed,
        answers: JSON.parse(JSON.stringify(examState.answers)),
        essayScores,
        pgScore,
        pgkScore,
        essayScore,
        totalScore: currentAttemptScore,
        attemptCount: examState.attemptNumber
      };

      const existingIdx = appState.submissions.findIndex(s => s.studentId === examState.studentId);
      let finalSavedSub = newSub;

      if (existingIdx >= 0) {
        const prev = appState.submissions[existingIdx];
        if (prev.totalScore > currentAttemptScore) {
          prev.attemptCount = MAX_ATTEMPTS;
          finalSavedSub = prev;
        } else {
          newSub.attemptCount = MAX_ATTEMPTS;
          appState.submissions[existingIdx] = newSub;
          finalSavedSub = newSub;
        }
      } else {
        appState.submissions.unshift(newSub);
      }

      saveState();

      examState.phase = 'result';
      examState.cloudSaveStatus = cloudState.url ? 'saving' : 'local';
      examState.lastResult = {
        studentName: finalSavedSub.studentName,
        kelas: finalSavedSub.kelas,
        bestScore: finalSavedSub.totalScore,
        currentAttemptScore,
        attemptCount: finalSavedSub.attemptCount
      };
      renderStudentExam();

      if (autoSubmit) {
        showToast('Waktu ujian habis! Jawaban otomatis dikumpulkan.', 'warning');
      }

      if (cloudState.url) {
        const stObj = appState.students.find(s => s.id === examState.studentId);
        const res = await cloudPost({
          action: 'submitExam',
          student: stObj,
          submission: finalSavedSub,
          questionsMeta: getQuestionsMeta()
        }, true);
        examState.cloudSaveStatus = res.ok ? 'saved' : 'error';
        if (examState.phase === 'result') renderStudentExam();
      }
    }

    /*************************************************************************
     * 13. INISIALISASI APLIKASI
     *************************************************************************/
    initCloudConfig();
    loadState();

    // Periksa jika ada sesi ujian aktif yang belum selesai di HP siswa
    const pendingSession = checkActiveExamSession();
    openStudentExamMode();

    if (cloudState.url) {
      syncPullFromSheet(true);
    }
  </script>
</body>
</html>
