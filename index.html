    // -------------------------------------------------------------------------
    // 1. EMBEDDED LIGHTWEIGHT QR CODE SVG/CANVAS GENERATOR
    // -------------------------------------------------------------------------
    const QRGen = (function() {
      // Deterministic SVG QR representation generator
      function generateSVG(text, size = 120) {
        let hash = 0;
        for (let i = 0; i < text.length; i++) {
          hash = ((hash << 5) - hash) + text.charCodeAt(i);
          hash |= 0;
        }

        const matrixSize = 25; // 25x25 grid
        const cellSize = size / matrixSize;
        let rects = [];

        // Helper to check standard finder patterns (3 corner squares)
        function isFinderPattern(r, c) {
          if (r < 7 && c < 7) return true; // Top-left
          if (r < 7 && c >= matrixSize - 7) return true; // Top-right
          if (r >= matrixSize - 7 && c < 7) return true; // Bottom-left
          return false;
        }

        function isFinderBorder(r, c) {
          // Draw standard 7x7 finder patterns
          if ((r === 0 || r === 6) && c <= 6) return true;
          if ((c === 0 || c === 6) && r <= 6) return true;
          if (r >= 2 && r <= 4 && c >= 2 && c <= 4) return true;

          if ((r === 0 || r === 6) && c >= matrixSize - 7) return true;
          if ((c === matrixSize - 1 || c === matrixSize - 7) && r <= 6) return true;
          if (r >= 2 && r <= 4 && c >= matrixSize - 5 && c <= matrixSize - 3) return true;

          if ((r === matrixSize - 7 || r === matrixSize - 1) && c <= 6) return true;
          if ((c === 0 || c === 6) && r >= matrixSize - 7) return true;
          if (r >= matrixSize - 5 && r <= matrixSize - 3 && c >= 2 && c <= 4) return true;

          return false;
        }

        // Timing patterns
        for (let r = 0; r < matrixSize; r++) {
          for (let c = 0; c < matrixSize; c++) {
            let isBlack = false;

            if (isFinderPattern(r, c)) {
              isBlack = isFinderBorder(r, c);
            } else if (r === 6 || c === 6) {
              isBlack = (r + c) % 2 === 0;
            } else {
              // Pseudo-random pseudo module matrix derived from token text
              const cellHash = Math.sin((r * 31) + (c * 17) + hash) * 10000;
              isBlack = (cellHash - Math.floor(cellHash)) > 0.45;
            }

            if (isBlack) {
              rects.push(`<rect x="${(c * cellSize).toFixed(2)}" y="${(r * cellSize).toFixed(2)}" width="${cellSize.toFixed(2)}" height="${cellSize.toFixed(2)}" fill="#35245E" />`);
            }
          }
        }

        return `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="mx-auto">
            <rect width="${size}" height="${size}" fill="#FFFFFF" rx="6"/>
            ${rects.join('')}
          </svg>
        `;
      }

      return { generateSVG };
    })();

    // -------------------------------------------------------------------------
    // 2. EMBEDDED SYNTHETIC WEB AUDIO API & INDONESIAN SPEECH SYNTHESIS
    // -------------------------------------------------------------------------
    const SoundFx = (function() {
      let audioCtx = null;
      let voiceEnabled = localStorage.getItem('sima_audio_voice') !== 'false';
      let soundEnabled = localStorage.getItem('sima_audio_sound') !== 'false';
      let availableVoices = [];

      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        function cacheVoices() {
          try { availableVoices = window.speechSynthesis.getVoices() || []; } catch(e) {}
        }
        cacheVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = cacheVoices;
        }
      }

      function getCtx() {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function speak(text) {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'id-ID';
          u.rate = 1.05;
          u.pitch = 1.1;
          u.volume = 1.0;

          if (availableVoices.length === 0) {
            availableVoices = window.speechSynthesis.getVoices() || [];
          }
          const idVoice = availableVoices.find(v => 
            (v.lang && (v.lang.toLowerCase().includes('id') || v.lang.toLowerCase().includes('ind'))) ||
            (v.name && v.name.toLowerCase().includes('indonesia'))
          );
          if (idVoice) u.voice = idVoice;

          window.speechSynthesis.speak(u);
        } catch (e) {
          console.warn('Speech error:', e);
        }
      }

      function playSuccess(studentName = '') {
        if (soundEnabled) {
          try {
            const ctx = getCtx();
            if (ctx) {
              const now = ctx.currentTime;
              const notes = [659.25, 830.61, 987.77, 1318.51]; // E5, G#5, B5, E6
              const durations = [0.08, 0.08, 0.09, 0.35];

              let offset = 0;
              notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = idx === notes.length - 1 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(freq, now + offset);

                const startT = now + offset;
                const dur = durations[idx];
                gain.gain.setValueAtTime(0.001, startT);
                gain.gain.linearRampToValueAtTime(0.22, startT + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startT + dur);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startT);
                osc.stop(startT + dur);
                offset += 0.07;
              });
            }
          } catch (e) {}
        }

        if (voiceEnabled) {
          setTimeout(() => {
            let clean = studentName ? studentName.trim() : '';
            if (clean) {
              const parts = clean.split(/\s+/);
              if (parts.length > 2) clean = parts.slice(0, 2).join(' ');
            }
            speak(clean ? `Absensi sukses! ${clean}, hadir!` : 'Absensi sukses! Hadir!');
          }, 180);
        }
      }

      function playWarning(studentName = '') {
        if (soundEnabled) {
          try {
            const ctx = getCtx();
            if (ctx) {
              const now = ctx.currentTime;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(783.99, now);
              osc.frequency.setValueAtTime(523.25, now + 0.1);
              gain.gain.setValueAtTime(0.2, now);
              gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.28);
            }
          } catch (e) {}
        }

        if (voiceEnabled) {
          setTimeout(() => {
            let clean = studentName ? studentName.trim() : '';
            if (clean) {
              const parts = clean.split(/\s+/);
              if (parts.length > 2) clean = parts.slice(0, 2).join(' ');
            }
            speak(`Perhatian! ${clean || 'Siswa'} sudah tercatat hadir.`);
          }, 200);
        }
      }

      function playError(reason = '') {
        if (soundEnabled) {
          try {
            const ctx = getCtx();
            if (ctx) {
              const now = ctx.currentTime;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(220, now);
              osc.frequency.linearRampToValueAtTime(146.83, now + 0.25);
              gain.gain.setValueAtTime(0.25, now);
              gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.3);
            }
          } catch (e) {}
        }

        if (voiceEnabled) {
          setTimeout(() => {
            speak(reason ? `Absensi ditolak: ${reason}` : 'Absensi gagal! QR Code tidak dikenali.');
          }, 200);
        }
      }

      function setVoiceEnabled(s) {
        voiceEnabled = Boolean(s);
        localStorage.setItem('sima_audio_voice', voiceEnabled ? 'true' : 'false');
      }
      function isVoiceEnabled() { return voiceEnabled; }
      function setSoundEnabled(s) {
        soundEnabled = Boolean(s);
        localStorage.setItem('sima_audio_sound', soundEnabled ? 'true' : 'false');
      }
      function isSoundEnabled() { return soundEnabled; }

      return { 
        playSuccess, playWarning, playError, speak,
        setVoiceEnabled, isVoiceEnabled, setSoundEnabled, isSoundEnabled
      };
    })();

        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const d = parseInt(parts[2], 10);
          const m = parseInt(parts[1], 10);
          const y = parseInt(parts[0], 10);
          const months = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
          return `${d} ${months[m]} ${y}`;
        }
      } catch (e) {}
      return dateStr;
    }

        store.records.forEach(r => {
          if (r.status === 'HADIR') hadir++;

          else if (r.status === 'IZIN') izin++;
          else if (r.status === 'ALPHA') alpha++;

      function quickAddStudent(defaultClass = '') {
        const store = state.store;
        const nis = prompt('Masukkan NIS Siswa (contoh: 262707010):');
        if (!nis || !nis.trim()) return;

        // Check duplicate NIS
        const cleanNis = nis.trim();
        const existing = store.students.find(s => s.nis === cleanNis && s.is_active === 1);
        if (existing) {
          SoundFx.playError();
          notify(`Gagal: NIS ${cleanNis} sudah digunakan oleh siswa ${existing.full_name} di Kelas ${existing.class_name}!`, 'error');
          return;
        }

        const name = prompt('Masukkan Nama Lengkap Siswa:');
        if (!name || !name.trim()) return;

        const gender = prompt('Jenis Kelamin Siswa (L/P):', 'L');
        const cleanGender = (gender || 'L').toUpperCase().charAt(0) === 'P' ? 'P' : 'L';

        const chosenClass = prompt('Masukkan Rombel Siswa (contoh: 7A, 8A, 9A):', defaultClass || '7A');
        if (!chosenClass || !chosenClass.trim()) return;

        const cleanClass = chosenClass.trim().toUpperCase();
        const clsObj = store.classes.find(c => c.name.toUpperCase() === cleanClass);

        store.students.push({
          id: Date.now(),
          nis: cleanNis,
          full_name: name.trim(),
          gender: cleanGender,
          class_id: clsObj ? clsObj.id : 1,
          class_name: cleanClass,
          qr_token: LocalDB.generateToken(),
          is_active: 1
        });
        LocalDB.saveStore(store);
        SoundFx.playSuccess();
        notify(`Siswa ${name.trim()} (${cleanNis}) berhasil didaftarkan ke Kelas ${cleanClass}!`, 'success');
        renderStudents(document.getElementById('main-view'), { className: cleanClass });
      }

      function deleteAllStudentsInClass(className) {
        if (!className) return;
        const store = state.store;
        const count = store.students.filter(s => s.class_name.toUpperCase() === className.toUpperCase() && s.is_active === 1).length;

        if (count === 0) {
          notify(`Kelas ${className} sudah kosong (0 siswa).`, 'info');
          return;
        }

        if (confirm(`Apakah Anda yakin ingin menghapus SELURUH ${count} siswa di Kelas ${className}?\n\n• Rombel Kelas ${className} akan menjadi kosong (0 siswa).\n• Memudahkan Anda untuk mengosongkan rombel atau mengimpor ulang data siswa baru.\n\nLanjutkan?`)) {
          store.students = store.students.filter(s => !(s.class_name.toUpperCase() === className.toUpperCase() && s.is_active === 1));
          LocalDB.saveStore(store);
          SoundFx.playSuccess();
          notify(`Seluruh ${count} siswa di Kelas ${className} berhasil dihapus. Rombel kini kosong (0 siswa).`, 'success');
          renderStudents(document.getElementById('main-view'), { className });
        }
      }

      function wireStandaloneImportModal() {
        const btnProcess = document.getElementById('btn-process-preview');
        const btnCommit = document.getElementById('btn-commit-import-students');
        if (!btnProcess || !btnCommit) return;

        btnProcess.onclick = async () => {
          const store = state.store;
          const targetClass = document.getElementById('modal-import-target-class').value;
          const fileInput = document.getElementById('modal-import-file');
          const pasteInput = document.getElementById('modal-import-paste').value.trim();

          let rawText = '';
          if (fileInput && fileInput.files.length > 0) {
            rawText = await fileInput.files[0].text();
          } else if (pasteInput) {
            rawText = pasteInput;
          } else {
            notify('Silakan pilih berkas .csv atau tempel data dari Excel terlebih dahulu!', 'warning');
            return;
          }

          const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length === 0) {
            notify('Tidak ada baris data ditemukan.', 'warning');
            return;
          }

          pendingImportList = [];
          const existingNisSet = new Set(store.students.filter(s => s.is_active === 1).map(s => s.nis));
          const fileNisSet = new Set();

          lines.forEach((line, idx) => {
            if (idx === 0 && (line.toLowerCase().includes('nis') || line.toLowerCase().includes('nama'))) return;

            const parts = line.split(/[,;\t]/).map(p => p.trim().replace(/^["']|["']$/g, ''));
            if (parts.length >= 2) {
              const nis = parts[0];
              const fullName = parts[1];
              const gender = (parts[2] || 'L').toUpperCase().charAt(0) === 'P' ? 'P' : 'L';
              let className = targetClass || (parts[3] ? parts[3].toUpperCase() : '');

              let status = 'VALID';
              let message = 'Siap Disimpan';

              if (!nis || !fullName) {
                status = 'INVALID';
                message = 'NIS / Nama Kosong';
              } else if (!className) {
                status = 'INVALID';
                message = 'Rombel belum ditentukan';
              } else if (existingNisSet.has(nis)) {
                status = 'DUPLICATE';
                message = 'NIS sudah ada di Database';
              } else if (fileNisSet.has(nis)) {
                status = 'DUPLICATE';
                message = 'NIS ganda dalam berkas';
              } else {
                fileNisSet.add(nis);
              }

              pendingImportList.push({
                nis,
                fullName,
                gender,
                className,
                status,
                message
              });
            }
          });

          const validRows = pendingImportList.filter(r => r.status === 'VALID');
          const previewBox = document.getElementById('modal-import-preview-box');
          const statText = document.getElementById('preview-stat-text');
          const validBadge = document.getElementById('preview-valid-badge');
          const tbody = document.getElementById('preview-table-tbody');

          statText.textContent = `${pendingImportList.length} Baris Terdeteksi`;
          validBadge.textContent = `${validRows.length} Siap Disimpan`;
          validBadge.className = `px-2.5 py-0.5 rounded-full font-bold ${validRows.length > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;

          tbody.innerHTML = pendingImportList.map(r => `
            <tr class="hover:bg-gray-50">
              <td class="p-2 font-mono font-bold">${r.nis}</td>
              <td class="p-2 font-medium">${r.fullName}</td>
              <td class="p-2 text-center font-bold">${r.gender}</td>
              <td class="p-2 text-center font-bold">${r.className}</td>
              <td class="p-2">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.status === 'VALID' ? 'bg-green-100 text-green-700' : (r.status === 'DUPLICATE' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700')}">
                  ${r.message}
                </span>
              </td>
            </tr>
          `).join('');

          previewBox.classList.remove('hidden');

          if (validRows.length > 0) {
            btnCommit.textContent = `💾 Simpan ${validRows.length} Siswa ke Database`;
            btnCommit.classList.remove('hidden');
          } else {
            btnCommit.classList.add('hidden');
            notify('Tidak ada data valid yang dapat disimpan. Periksa NIS duplikat atau kolom kelas.', 'error');
          }
        };

        btnCommit.onclick = () => {
          const store = state.store;
          const validRows = pendingImportList.filter(r => r.status === 'VALID');
          if (validRows.length === 0) return;

          validRows.forEach(r => {
            const cls = store.classes.find(c => c.name.toUpperCase() === r.className.toUpperCase());
            store.students.push({
              id: Date.now() + Math.floor(Math.random() * 10000),
              nis: r.nis,
              full_name: r.fullName,
              gender: r.gender,
              class_id: cls ? cls.id : 1,
              class_name: r.className.toUpperCase(),
              qr_token: LocalDB.generateToken(),
              is_active: 1
            });
          });

          LocalDB.saveStore(store);
          SoundFx.playSuccess();
          notify(`Berhasil mengimpor ${validRows.length} siswa ke dalam database!`, 'success');
          document.getElementById('modal-standalone-import').classList.add('hidden');

          const targetClass = document.getElementById('modal-import-target-class').value;
          renderStudents(document.getElementById('main-view'), { className: targetClass || activeFilterClass });
        };
      }

      function simulateScan(token) {
        const store = state.store;
        const student = store.students.find(s => s.qr_token === token && s.is_active === 1);
        if (!student) {
          SoundFx.playError('QR Code tidak dikenali dalam sistem');
          notify('❌ <b>Absensi Ditolak:</b> QR Code tidak dikenali dalam sistem!', 'error');
          return;
        }

        // Check if student belongs to active class
        if (student.class_id !== activeClassId) {
          SoundFx.playWarning(student.full_name);
          notify(`⚠️ <b>Perhatian:</b> Siswa ${student.full_name} terdaftar di Kelas ${student.class_name}, bukan kelas sesi ini!`, 'warning');
          return;
        }

        // Check duplicate
        const todayDate = new Date().toISOString().split('T')[0];
        const existing = store.records.find(r => r.student_id === student.id && r.date === todayDate);
        if (existing) {
          SoundFx.playWarning(student.full_name);
          notify(`⚠️ <b>DUPLIKAT:</b> Siswa ${student.full_name} sudah tercatat HADIR pukul ${existing.time}.`, 'warning');
          return;
        }

        // Record Hadir
        const timeWIB = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';
        store.records.push({
          id: Date.now(),
          student_id: student.id,
          student_name: student.full_name,
          class_name: student.class_name,
          date: todayDate,
          time: timeWIB,
          status: 'HADIR'
        });
        LocalDB.saveStore(store);

        // PLAY PLEASANT SUCCESS CHIME & INDONESIAN SPEECH SYNTHESIS ("Absensi Sukses! [Nama], Hadir!")
        SoundFx.playSuccess(student.full_name);

        // PROMINENT TOAST NOTIFICATION: ABSENSI SUKSES MASUK LAPORAN
        notify(`🎉 <b>Absensi Sukses!</b> ${student.full_name} (${student.nis}) berhasil tercatat HADIR dan masuk ke Laporan Presensi.`, 'success');

        // Update Confirmation Flash Box
        const flashBox = document.getElementById('box-last-scan-status');
        if (flashBox) {
          document.getElementById('box-last-scan-name').textContent = student.full_name;
          document.getElementById('box-last-scan-nis').textContent = `NIS: ${student.nis} • Kelas ${student.class_name}`;
          document.getElementById('box-last-scan-time').textContent = timeWIB;
          flashBox.classList.remove('hidden');
        }

        // Update feed
        const feed = document.getElementById('live-scan-feed');
        if (feed) {
          if (feed.querySelector('p')) {
            feed.innerHTML = '';
          }
          const item = document.createElement('div');
          item.className = 'p-3 rounded-2xl border-2 border-emerald-200 bg-emerald-50 flex items-center justify-between text-xs shadow-xs';
          item.innerHTML = `
            <div>
              <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 rounded text-[9px] font-black uppercase bg-emerald-200 text-emerald-800">Absensi Sukses</span>
                <p class="font-bold text-[#292536]">${student.full_name}</p>
              </div>
              <p class="text-[10px] text-[#777386] font-mono mt-0.5">NIS: ${student.nis} • ${timeWIB} • Masuk Laporan ✓</p>
            </div>
            <span class="px-2.5 py-1 rounded-lg font-black bg-emerald-600 text-white text-[10px] shadow-xs">HADIR</span>
          `;
          feed.prepend(item);
        }

        // Update badge count
        const countBadge = document.getElementById('scan-count-badge');
        if (countBadge) {
          const presentToday = store.records.filter(r => r.date === todayDate && r.class_name === student.class_name && r.status === 'HADIR').length;
          countBadge.textContent = `${presentToday} Hadir`;
        }
      }

      function closeSessionDialog(cls) {
        const store = state.store;
        const todayDate = new Date().toISOString().split('T')[0];
        const classStudents = store.students.filter(s => s.class_id === cls.id && s.is_active === 1);
        const presentIds = new Set(store.records.filter(r => r.date === todayDate).map(r => r.student_id));
        const unscanned = classStudents.filter(s => !presentIds.has(s.id));

        if (confirm(`AKHIRI SESI: Ada ${unscanned.length} siswa yang belum scan. Apakah Anda ingin menutup sesi dan otomatis menandai mereka sebagai ALPHA?`)) {
          unscanned.forEach(st => {
            store.records.push({
              id: Date.now() + Math.random(),
              student_id: st.id,
              student_name: st.full_name,
              class_name: st.class_name,
              date: todayDate,
              time: '-',
              status: 'ALPHA'
            });
          });

          store.sessions.push({
            id: Date.now(),
            class_id: cls.id,
            class_name: cls.name,
            date: todayDate,
            status: 'CLOSED'
          });

          LocalDB.saveStore(store);
          notify(`Sesi Kelas ${cls.name} berhasil ditutup! ${unscanned.length} siswa otomatis ditandai ALPHA.`, 'success');
          navigate('history');
        }
      }

      function correctStatus(recordId) {
        const store = state.store;
        const rec = store.records.find(r => r.id === recordId);
        if (!rec) return;

        const newStatus = prompt(`Koreksi status untuk ${rec.student_name} (saat ini ${rec.status}). Ketik: HADIR / SAKIT / IZIN / ALPHA:`, rec.status);
        if (!newStatus || !['HADIR', 'SAKIT', 'IZIN', 'ALPHA'].includes(newStatus.toUpperCase())) return;

        const reason = prompt('Wajib masukkan alasan koreksi:', 'Surat izin menyusul');
        if (!reason) return;

        store.audit_logs.push({
          id: Date.now(),
          record_id: recordId,
          student_name: rec.student_name,
          old_status: rec.status,
          new_status: newStatus.toUpperCase(),
          reason: reason,
          time: new Date().toLocaleTimeString('id-ID')
        });

        rec.status = newStatus.toUpperCase();
        LocalDB.saveStore(store);
        notify(`Status berhasil dikoreksi menjadi ${newStatus.toUpperCase()}. Jejak audit tersimpan.`, 'success');
        navigate('history');
      }

        function generateDonutSvg(hadir, sakit, izin, alpha, size = 170) {
          const total = hadir + sakit + izin + alpha;
          const pctHadir = total > 0 ? Math.round((hadir / total) * 100) : 0;
          if (total === 0) {
            return `
              <div class="relative flex items-center justify-center" style="width: ${size}px; height: ${size}px;">
                <svg width="${size}" height="${size}" viewBox="0 0 100 100" class="transform -rotate-90">
                  <circle cx="50" cy="50" r="38" fill="none" stroke="#E8E4EF" stroke-width="12" />
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                  <span class="text-xs font-bold text-[#777386]">0 Data</span>
                </div>
              </div>
            `;
          }
          const C = 2 * Math.PI * 38;
          const lenH = (hadir / total) * C;
          const lenS = (sakit / total) * C;
          const lenI = (izin / total) * C;
          const lenA = (alpha / total) * C;
          const offH = 0;
          const offS = -lenH;
          const offI = -(lenH + lenS);
          const offA = -(lenH + lenS + lenI);

          return `
            <div class="relative flex items-center justify-center" style="width: ${size}px; height: ${size}px;">
              <svg width="${size}" height="${size}" viewBox="0 0 100 100" class="transform -rotate-90 select-none">
                <circle cx="50" cy="50" r="38" fill="none" stroke="#F0EDF9" stroke-width="12" />
                ${lenH > 0 ? `<circle cx="50" cy="50" r="38" fill="none" stroke="#16A34A" stroke-width="12" stroke-dasharray="${lenH} ${C - lenH}" stroke-dashoffset="${offH}" />` : ''}
                ${lenS > 0 ? `<circle cx="50" cy="50" r="38" fill="none" stroke="#2563EB" stroke-width="12" stroke-dasharray="${lenS} ${C - lenS}" stroke-dashoffset="${offS}" />` : ''}
                ${lenI > 0 ? `<circle cx="50" cy="50" r="38" fill="none" stroke="#D97706" stroke-width="12" stroke-dasharray="${lenI} ${C - lenI}" stroke-dashoffset="${offI}" />` : ''}
                ${lenA > 0 ? `<circle cx="50" cy="50" r="38" fill="none" stroke="#DC2626" stroke-width="12" stroke-dasharray="${lenA} ${C - lenA}" stroke-dashoffset="${offA}" />` : ''}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                <span class="text-2xl font-black text-[#292536] leading-none">${pctHadir}%</span>
                <span class="text-[10px] font-bold text-emerald-800 uppercase tracking-wider mt-0.5">Kehadiran</span>
              </div>
            </div>
          `;
        }

        function generateDailyBarSvg(daysData, highlightedDay = null, width = 640, height = 200) {
          const maxVal = Math.max(1, ...daysData.map(d => d.total));
          const paddingLeft = 32;
          const paddingRight = 16;
          const paddingTop = 25;
          const paddingBottom = 28;
          const plotWidth = width - paddingLeft - paddingRight;
          const plotHeight = height - paddingTop - paddingBottom;
          const barSlotWidth = plotWidth / daysData.length;
          const barWidth = Math.max(4, barSlotWidth * 0.72);

          let gridLines = '';
          [0, 0.5, 1].forEach(ratio => {
            const y = paddingTop + plotHeight * (1 - ratio);
            const val = Math.round(maxVal * ratio);
            gridLines += `
              <line x1="${paddingLeft}" y1="${y}" x2="${width - paddingRight}" y2="${y}" stroke="#E8E4EF" stroke-dasharray="3,3" stroke-width="1"/>
              <text x="${paddingLeft - 6}" y="${y + 3}" font-size="9" fill="#777386" text-anchor="end" font-family="monospace">${val}</text>
            `;
          });

          let bars = '';
          daysData.forEach((d, i) => {
            const x = paddingLeft + i * barSlotWidth + (barSlotWidth - barWidth) / 2;
            const isSelected = highlightedDay && (d.day === highlightedDay || d.dateStr === highlightedDay);

            const hTotal = d.total > 0 ? (d.total / maxVal) * plotHeight : 0;
            const yTop = paddingTop + (plotHeight - hTotal);

            const hHadir = d.total > 0 ? (d.hadir / maxVal) * plotHeight : 0;
            const hSakit = d.total > 0 ? (d.sakit / maxVal) * plotHeight : 0;
            const hIzin = d.total > 0 ? (d.izin / maxVal) * plotHeight : 0;
            const hAlpha = d.total > 0 ? (d.alpha / maxVal) * plotHeight : 0;

            let currY = paddingTop + plotHeight;

            let hadirRect = '';
            if (hHadir > 0) {
              currY -= hHadir;
              hadirRect = `<rect x="${x}" y="${currY}" width="${barWidth}" height="${hHadir}" fill="#16A34A" rx="${currY === yTop ? 2 : 0}" />`;
            }
            let sakitRect = '';
            if (hSakit > 0) {
              currY -= hSakit;
              sakitRect = `<rect x="${x}" y="${currY}" width="${barWidth}" height="${hSakit}" fill="#2563EB" rx="${currY === yTop ? 2 : 0}" />`;
            }
            let izinRect = '';
            if (hIzin > 0) {
              currY -= hIzin;
              izinRect = `<rect x="${x}" y="${currY}" width="${barWidth}" height="${hIzin}" fill="#D97706" rx="${currY === yTop ? 2 : 0}" />`;
            }
            let alphaRect = '';
            if (hAlpha > 0) {
              currY -= hAlpha;
              alphaRect = `<rect x="${x}" y="${currY}" width="${barWidth}" height="${hAlpha}" fill="#DC2626" rx="${currY === yTop ? 2 : 0}" />`;
            }

            const showLabel = d.day === 1 || d.day % 5 === 0 || d.day === daysData.length || isSelected;
            const dayLabel = showLabel ? `
              <text x="${x + barWidth / 2}" y="${height - 10}" font-size="${isSelected ? '10' : '9'}" font-weight="${isSelected ? 'bold' : 'normal'}" fill="${isSelected ? '#35245E' : '#777386'}" text-anchor="middle" font-family="monospace">
                ${d.day}
              </text>
            ` : '';

            let pinMarker = '';
            if (isSelected) {
              pinMarker = `
                <rect x="${x - 2}" y="${Math.max(4, yTop - 4)}" width="${barWidth + 4}" height="${Math.min(plotHeight + 8, hTotal + 8)}" fill="none" stroke="#35245E" stroke-width="2" rx="4" />
                <circle cx="${x + barWidth / 2}" cy="${Math.max(8, yTop - 6)}" r="3" fill="#35245E" />
                <text x="${x + barWidth / 2}" y="${Math.max(8, yTop - 12)}" font-size="9" font-weight="bold" fill="#35245E" text-anchor="middle">★ Tgl ${d.day}</text>
              `;
            }

            bars += `
              <g class="cursor-pointer group">
                <title>Tanggal ${d.day} (${d.dateStr}):\n• Hadir: ${d.hadir}\n• Sakit: ${d.sakit}\n• Izin: ${d.izin}\n• Alpha: ${d.alpha}\n• Total: ${d.total} (${d.pct}%)</title>
                <rect x="${x - 1}" y="${paddingTop}" width="${barWidth + 2}" height="${plotHeight}" fill="#F0EDF9" opacity="0" class="hover:opacity-40 transition-opacity" />
                ${alphaRect}
                ${izinRect}
                ${sakitRect}
                ${hadirRect}
                ${pinMarker}
                ${dayLabel}
              </g>
            `;
          });

          return `
            <svg viewBox="0 0 ${width} ${height}" class="w-full h-auto overflow-visible select-none">
              ${gridLines}
              ${bars}
              <line x1="${paddingLeft}" y1="${paddingTop + plotHeight}" x2="${width - paddingRight}" y2="${paddingTop + plotHeight}" stroke="#B9A7E8" stroke-width="1.5" />
            </svg>
          `;

        function generateComparisonSvg(classStatsList) {

      function wireScheduleImportEvents() {
        const btnProcess = document.getElementById('btn-process-schedule-preview');
        const btnCommit = document.getElementById('btn-commit-import-schedule');
        if (!btnProcess || !btnCommit) return;

        btnProcess.onclick = async () => {
          const store = state.store;
          const fileInput = document.getElementById('modal-import-schedule-file');
          const pasteInput = document.getElementById('modal-import-schedule-paste').value.trim();

          let rawText = '';
          if (fileInput && fileInput.files.length > 0) {
            rawText = await fileInput.files[0].text();
          } else if (pasteInput) {
            rawText = pasteInput;
          } else {
            notify('Silakan pilih berkas .csv atau tempel data jadwal dari Excel terlebih dahulu!', 'warning');
            return;
          }

          const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
          if (lines.length === 0) {
            notify('Tidak ada baris data ditemukan.', 'warning');
            return;
          }

          pendingScheduleImportList = [];
          const validDays = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
          const validDayMap = {
            'SENIN': 'Senin', 'SELASA': 'Selasa', 'RABU': 'Rabu',
            'KAMIS': 'Kamis', 'JUMAT': 'Jumat', 'JUM\'AT': 'Jumat', 'SABTU': 'Sabtu'
          };

          const classNamesMap = {};
          store.classes.forEach(c => {
            classNamesMap[c.name.toUpperCase()] = c;
          });

          lines.forEach((line, idx) => {
            // Skip header if line matches
            if (idx === 0 && (line.toLowerCase().includes('hari') || line.toLowerCase().includes('kelas'))) return;

            const parts = line.split(/[,;\t]/).map(p => p.trim().replace(/^["']|["']$/g, ''));
            if (parts.length >= 2) {
              const rawDay = (parts[0] || '').toUpperCase();
              const day = validDayMap[rawDay] || parts[0];
              const className = (parts[1] || '').toUpperCase();
              const startTime = parts[2] || '07:30';
              const endTime = parts[3] || '09:00';
              const room = parts[4] || 'Lab Komputer 1';
              const topic = parts[5] || 'Informatika';

              let status = 'VALID';
              let message = 'Siap Disimpan';

              if (!validDays.includes(day)) {
                status = 'INVALID';
                message = `Hari tidak valid (${parts[0]})`;
              } else if (!classNamesMap[className]) {
                status = 'INVALID';
                message = `Rombel ${className} tidak terdaftar di 29 Kelas`;
              } else if (!startTime || !endTime) {
                status = 'INVALID';
                message = 'Jam mulai / selesai kosong';
              }

              pendingScheduleImportList.push({
                day,
                className,
                startTime,
                endTime,
                room,
                topic,
                status,
                message,
                classId: classNamesMap[className] ? classNamesMap[className].id : 1
              });
            }
          });

          const validRows = pendingScheduleImportList.filter(r => r.status === 'VALID');
          const previewBox = document.getElementById('modal-import-schedule-preview-box');
          const statText = document.getElementById('preview-schedule-stat-text');
          const validBadge = document.getElementById('preview-schedule-valid-badge');
          const tbody = document.getElementById('preview-schedule-table-tbody');

          statText.textContent = `${pendingScheduleImportList.length} Baris Jadwal Terdeteksi`;
          validBadge.textContent = `${validRows.length} Siap Disimpan`;
          validBadge.className = `px-2.5 py-0.5 rounded-full font-bold ${validRows.length > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700'}`;

          tbody.innerHTML = pendingScheduleImportList.map(r => `
            <tr class="hover:bg-slate-50">
              <td class="p-2 font-bold text-[#26154A]">${r.day}</td>
              <td class="p-2 font-bold text-[#35245E]">${r.className}</td>
              <td class="p-2 font-mono">${r.startTime} - ${r.endTime}</td>
              <td class="p-2">${r.room}</td>
              <td class="p-2 truncate max-w-[120px]">${r.topic}</td>
              <td class="p-2">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${r.status === 'VALID' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-700'}">
                  ${r.message}
                </span>
              </td>
            </tr>
          `).join('');

          previewBox.classList.remove('hidden');

          if (validRows.length > 0) {
            btnCommit.textContent = `💾 Simpan ${validRows.length} Jadwal ke Database`;
            btnCommit.classList.remove('hidden');
          } else {
            btnCommit.classList.add('hidden');
            notify('Tidak ada baris jadwal valid yang dapat disimpan.', 'error');
          }
        };

        btnCommit.onclick = () => {
          const store = state.store;
          const validRows = pendingScheduleImportList.filter(r => r.status === 'VALID');
          if (validRows.length === 0) return;

          validRows.forEach(r => {
            store.schedules.push({
              id: Date.now() + Math.floor(Math.random() * 10000),
              day_of_week: r.day,
              class_name: r.className,
              class_id: r.classId,
              start_time: r.startTime,
              end_time: r.endTime,
              room: r.room,
              topic_default: r.topic
            });
          });

          LocalDB.saveStore(store);
          SoundFx.playSuccess();
          notify(`Berhasil mengimpor ${validRows.length} jadwal pelajaran Informatika!`, 'success');
          document.getElementById('modal-schedule-import').classList.add('hidden');

          const mainView = document.getElementById('main-view');
          if (mainView) renderSchedule(mainView);
        };
      }

                  </div>

                  <!-- Bagian 2: Kepala Madrasah -->
                  <div class="pt-2 border-t border-[#E8E4EF] space-y-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-[#35245E]">2. Pimpinan / Kepala Madrasah</span>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs font-semibold text-[#777386] mb-1">Nama Kepala Madrasah (Beserta Gelar)</label>
                        <input type="text" id="cfg-headmaster-name" required value="${s.headmaster_name || ''}" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm focus:outline-none focus:border-[#35245E]">
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-[#777386] mb-1">NIP Kepala Madrasah</label>
                        <input type="text" id="cfg-headmaster-nip" value="${s.headmaster_nip || ''}" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm font-mono focus:outline-none focus:border-[#35245E]">
                      </div>
                    </div>
                  </div>

                  <!-- Bagian 3: Tahun Ajaran, Semester, & Tanggal Cetak -->
                  <div class="pt-2 border-t border-[#E8E4EF] space-y-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-[#35245E]">3. Periode Akademik & Tanggal Cetak Laporan</span>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label class="block text-xs font-semibold text-[#777386] mb-1">Tahun Ajaran</label>
                        <input type="text" id="cfg-academic-year" required value="${s.academic_year || '2026/2027'}" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm font-semibold focus:outline-none focus:border-[#35245E]">
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-[#777386] mb-1">Semester</label>
                        <select id="cfg-semester" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm font-semibold bg-white focus:outline-none focus:border-[#35245E]">
                          <option value="Ganjil" ${s.semester === 'Ganjil' ? 'selected' : ''}>Semester Ganjil</option>
                          <option value="Genap" ${s.semester === 'Genap' ? 'selected' : ''}>Semester Genap</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-[#777386] mb-1">Tanggal Cetak Dokumen</label>
                        <input type="date" id="cfg-report-print-date" value="${s.report_print_date || todayStr}" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm focus:outline-none focus:border-[#35245E]">
                      </div>
                    </div>
                  </div>

                  <!-- Bagian 4: Guru Mapel -->
                  <div class="pt-2 border-t border-[#E8E4EF] space-y-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-[#35245E]">4. Guru Pengampu Mata Pelajaran</span>
                    <div>
                      <label class="block text-xs font-semibold text-[#777386] mb-1">Nama Guru Pengampu (Beserta Gelar)</label>
                      <input type="text" id="cfg-teacher-name" required value="${s.teacher_name || ''}" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm focus:outline-none focus:border-[#35245E]">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs font-semibold text-[#777386] mb-1">NIP / NUPTK Guru</label>
                        <input type="text" id="cfg-teacher-nip" value="${s.teacher_nip || ''}" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm font-mono focus:outline-none focus:border-[#35245E]">
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-[#777386] mb-1">Mata Pelajaran</label>
                        <input type="text" id="cfg-subject-name" required value="${s.subject_name || 'Informatika'}" class="w-full px-3.5 py-2 rounded-xl border border-[#E8E4EF] text-sm focus:outline-none focus:border-[#35245E]">
                      </div>
                    </div>
                  </div>

                  <div class="pt-4 border-t border-[#E8E4EF] flex items-center justify-between">
                    <span class="text-xs text-[#777386]">Perubahan disimpan ke basis data persisten.</span>
                    <button type="submit" class="btn-primary text-sm shadow px-5 py-2.5 font-bold">
                      Simpan Pengaturan Admin
                    </button>
                  </div>
                </form>
              </div>

              <!-- Live Preview & Backup/Restore Column -->
              <div class="lg:col-span-5 space-y-6">
                <!-- Live Signature Preview Card -->
                <div class="sima-card p-5 bg-[#FAF9FD] border border-[#B9A7E8]/40">
                  <h3 class="text-xs font-bold text-[#35245E] uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <span>🔏 Pratinjau Pengesahan Dokumen Laporan</span>
                  </h3>
                  <div class="p-4 bg-white rounded-xl border border-[#E8E4EF] text-[11px] space-y-3">
                    <div class="text-right font-medium text-[#777386]" id="cfg-preview-titimangsa">
                      Wangon, ${formatIndoDate(s.report_print_date || todayStr)}
                    </div>
                    <div class="grid grid-cols-2 text-center pt-2 border-t border-dashed border-[#E8E4EF]">
                      <div>
                        <p class="text-[#777386]">Mengetahui,</p>
                        <p class="font-bold text-[#292536]" id="cfg-preview-head-title">Kepala ${s.school_name}</p>
                        <div class="h-10"></div>
                        <p class="font-bold underline text-[#292536]" id="cfg-preview-head-name">${s.headmaster_name}</p>
                        <p class="text-[#777386] font-mono text-[10px]" id="cfg-preview-head-nip">NIP. ${s.headmaster_nip || '-'}</p>
                      </div>
                      <div>
                        <p class="text-[#777386]">Guru Pengampu,</p>
                        <p class="font-bold text-[#292536]" id="cfg-preview-sub-title">${s.subject_name}</p>
                        <div class="h-10"></div>
                        <p class="font-bold underline text-[#292536]" id="cfg-preview-teach-name">${s.teacher_name}</p>
                        <p class="text-[#777386] font-mono text-[10px]" id="cfg-preview-teach-nip">NIP. ${s.teacher_nip || '-'}</p>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Backup Database -->
                <div class="sima-card p-5 border-l-4 border-l-green-600">
                  <h3 class="text-sm font-bold text-green-700 mb-1 flex items-center gap-2">
                    <span>📥 Unduh Cadangan Database (.json)</span>
                  </h3>
                  <p class="text-xs text-gray-600 mb-3">Unduh seluruh siswa, 29 rombel, jadwal, dan riwayat absensi dalam satu file JSON.</p>
                  <button id="btn-export-json" class="btn-primary text-xs font-bold">Unduh Backup JSON</button>
                </div>

                <!-- Restore Database -->
                <div class="sima-card p-5 border-l-4 border-l-red-600">
                  <h3 class="text-sm font-bold text-red-700 mb-1 flex items-center gap-2">
                    <span>📤 Pemulihan Database (Restore)</span>
                  </h3>
                  <p class="text-xs text-gray-600 mb-3">Pulihkan database dari file backup JSON yang pernah Anda unduh.</p>
                  <input type="file" id="file-restore" accept=".json" class="text-xs mb-3 w-full">
                  <button id="btn-do-restore" class="px-3 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold">Pulihkan Database</button>
                </div>
              </div>
            </div>
          </div>
        `;

        // Live Preview update listener
        function updateCfgLivePreview() {
          const scName = container.querySelector('#cfg-school-name').value.trim() || "MTs Ma’arif NU 1 Wangon";
          const hmName = container.querySelector('#cfg-headmaster-name').value.trim() || "H. Mu’alim, S.Ag., M.Pd.I.";
          const hmNip = container.querySelector('#cfg-headmaster-nip').value.trim() || "";
          const tcName = container.querySelector('#cfg-teacher-name').value.trim() || "Fitrianto Puji Pangarso, S.Kom.";
          const tcNip = container.querySelector('#cfg-teacher-nip').value.trim() || "";
          const sbName = container.querySelector('#cfg-subject-name').value.trim() || "Informatika";
          const prDate = container.querySelector('#cfg-report-print-date').value || todayStr;

          container.querySelector('#cfg-preview-titimangsa').textContent = `Wangon, ${formatIndoDate(prDate)}`;
          container.querySelector('#cfg-preview-head-title').textContent = `Kepala ${scName}`;
          container.querySelector('#cfg-preview-head-name').textContent = hmName;
          container.querySelector('#cfg-preview-head-nip').textContent = hmNip ? `NIP. ${hmNip}` : '-';
          container.querySelector('#cfg-preview-sub-title').textContent = sbName;
          container.querySelector('#cfg-preview-teach-name').textContent = tcName;
          container.querySelector('#cfg-preview-teach-nip').textContent = tcNip ? `NIP. ${tcNip}` : '-';
        }

        const cfgInputs = ['#cfg-school-name', '#cfg-headmaster-name', '#cfg-headmaster-nip', '#cfg-teacher-name', '#cfg-teacher-nip', '#cfg-subject-name', '#cfg-report-print-date'];
        cfgInputs.forEach(sel => {
          const el = container.querySelector(sel);
          if (el) {
            el.addEventListener('input', updateCfgLivePreview);
            el.addEventListener('change', updateCfgLivePreview);
          }
        });

        // Form Submit
        container.querySelector('#form-admin-settings').onsubmit = (e) => {
          e.preventDefault();
          store.settings = {
            ...store.settings,
            school_name: container.querySelector('#cfg-school-name').value.trim(),
            school_address: container.querySelector('#cfg-school-address').value.trim(),
            headmaster_name: container.querySelector('#cfg-headmaster-name').value.trim(),
            headmaster_nip: container.querySelector('#cfg-headmaster-nip').value.trim(),
            academic_year: container.querySelector('#cfg-academic-year').value.trim(),
            semester: container.querySelector('#cfg-semester').value,
            report_print_date: container.querySelector('#cfg-report-print-date').value,
            teacher_name: container.querySelector('#cfg-teacher-name').value.trim(),
            teacher_nip: container.querySelector('#cfg-teacher-nip').value.trim(),
            subject_name: container.querySelector('#cfg-subject-name').value.trim()
          };

          LocalDB.saveStore(store);
          state.store = store;

          // Update header user info if elements exist
          const headerTeacher = document.querySelector('#header-user-fullname');
          if (headerTeacher) headerTeacher.textContent = store.settings.teacher_name;

          notify('Pengaturan identitas madrasah & admin berhasil disimpan!', 'success');
        };

        // Export JSON Backup
        document.getElementById('btn-export-json').onclick = () => {
          const jsonStr = JSON.stringify(store, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `backup_sima_standalone_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          notify('File cadangan database berhasil diunduh.', 'success');
        };

        // Restore JSON Backup
        document.getElementById('btn-do-restore').onclick = () => {
          const input = document.getElementById('file-restore');
          if (!input.files || input.files.length === 0) {
            notify('Pilih file backup .json terlebih dahulu!', 'warning');
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = JSON.parse(e.target.result);
              LocalDB.saveStore(data);
              state.store = data;
              notify('Database berhasil dipulihkan dari file backup!', 'success');
              navigate('dashboard');
            } catch (err) {
              notify('File JSON tidak valid atau rusak!', 'error');
            }
          };
          reader.readAsText(input.files[0]);
        };
      }

      // -----------------------------------------------------------------------
      // VIEW: GANTI PASSWORD
      // -----------------------------------------------------------------------
      function renderChangePassword(container) {
        container.innerHTML = `
          <div class="space-y-6">
            <div>
              <h1 class="text-2xl font-black text-[#292536]">Ganti Kata Sandi Akun</h1>
              <p class="text-xs text-[#777386]">Perbarui kata sandi akun guru pengelola</p>
            </div>
            <div class="max-w-md sima-card p-6">
              <form id="form-pwd" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-[#292536] mb-1">Kata Sandi Baru</label>
                  <input type="password" id="new-pwd" minlength="8" required class="w-full px-3.5 py-2.5 rounded-xl border border-[#E8E4EF] text-sm">
                </div>
                <button type="submit" class="btn-primary text-xs">Simpan Kata Sandi</button>
              </form>
            </div>
          </div>
        `;

        document.getElementById('form-pwd').onsubmit = (e) => {
          e.preventDefault();
          const p = document.getElementById('new-pwd').value;
          state.store.user.password = p;
          LocalDB.saveStore(state.store);
          notify('Kata sandi berhasil diperbarui!', 'success');
        };
      }

      function downloadSelf() {
        const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'SIMA_INFORMATIKA.html';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      return {
        init,
        navigate,
        simulateScan,
        deleteStudent,
        correctStatus,
        printSingleCard,
        filterByClass,
        quickAddStudent,
        deleteAllStudentsInClass,
        openImportModal,
        downloadCsvTemplate,
        openAddScheduleModal,
        editSchedule,
        deleteSchedule,
        deleteAllSchedules,
        openImportScheduleModal,
        downloadScheduleTemplate,
        startScanForClass,
        downloadSelf
      };
    })();

    // Bootstrap Standalone App
    document.addEventListener('DOMContentLoaded', () => {
      window.StandaloneApp = StandaloneApp;
      StandaloneApp.init();
    });
  </script>
</body>
</html>
